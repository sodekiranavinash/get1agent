[project]
name = "get1agent-user-api"
version = "0.1.0"
description = "User-facing HTTP API (agents, knowledge bases, storage, settings)"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.31",
    "python-dateutil>=2.8.2",
    # Optional infrastructure: the shared limiter/cache (core.ratelimit,
    # core.cache) use Redis when REDIS_URL is configured and fall back to
    # DynamoDB otherwise. Absent the extra, every path degrades safely.
    "redis>=5.0",
    "tzdata>=2024.1",
]