[project]
name = "get1agent-integration-tests"
version = "0.1.0"
description = "Backend integration tests (moto-backed DynamoDB + in-memory S3)"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.34",
    "moto[dynamodb]>=5.0",
    "pytest>=8.0",
    "awslabs.mcp-lambda-handler==0.1.15",
    "python-dateutil>=2.8.2",
]

[tool.pytest.ini_options]
# Import the shared get1agent package plus each Lambda's own package.
#
# Only services that are loaded via support.load_module() need to be here, and
# `src` is a top-level package name shared by several services: user-api and
# knowledge-mcp ship a NAMESPACE src/ (no __init__.py) so they merge and coexist,
# while the mcp/* services ship a REGULAR src/ that would hijack `src` for the
# whole process. So list only the handlers the suite actually loads here.
pythonpath = [
    "../../packages",
    "../apis/user-api",
    "../mcp/knowledge-mcp",
    "../admin/admin-console",
]
testpaths = ["."]
addopts = "-q"
