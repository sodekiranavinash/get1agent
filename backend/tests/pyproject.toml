[project]
name = "get1agent-tests"
version = "0.1.0"
description = "Backend integration tests (moto-backed DynamoDB + in-memory S3)"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.34",
    "moto[dynamodb]>=5.0",
    "pytest>=8.0",
    "awslabs.mcp-lambda-handler==0.1.15",
    "python-dateutil>=2.8.2",
]

[tool.pytest.ini_options]
# Import `shared` (backend/services) and `ai` (the Lambda layer) directly.
pythonpath = ["../services", "../services/layers/ai"]
testpaths = ["."]
addopts = "-q"
