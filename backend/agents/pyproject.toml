[project]
name = "get1agent-agents"
version = "0.0.0"
description = "AgentCore runtime (Strands) for get1agent: single-agent and workflow paths"
requires-python = ">=3.13"
dependencies = [
    "bedrock-agentcore>=1.10.0",
    "strands-agents[openai,otel]>=1.5.0",
    "boto3>=1.35",
    # Attachment text extraction (the agent container downloads storage files at
    # run time and extracts their text; these mirror the `extra-tools` layer).
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
]

# This is an application, not an installable library: uv installs only the
# dependencies into `.venv` and never tries to build/install the project itself.
[tool.uv]
package = false
