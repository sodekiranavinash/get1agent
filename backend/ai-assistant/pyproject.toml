[project]
name = "get1agent-ai-assistant"
version = "0.0.0"
description = "AI Assistant — the in-product assistant: LangChain Deep Agents, one Lambda behind two API Gateway routes"
requires-python = ">=3.11"

# AI Assistant is deliberately its own service with its own lockfile: it is the platform's
# one non-Strands agent, so keeping LangChain/LangGraph out of the agent-runtime
# image means neither framework can break the other.
dependencies = [
    # The harness: planning, filesystem-in-state, context management, middleware.
    "deepagents[aws]>=0.7.0",
    # AWS access: DynamoDB, S3, S3 Vectors, Bedrock.
    "boto3>=1.35",
    # The platform's own shared packages need these transitively, and declaring
    # them keeps the lockfile honest for the Lambda zip build too.
    "python-dateutil>=2.9",
    "tzdata>=2024.1",
]

# This is an application, not an installable library: uv installs only the
# dependencies into `.venv` and never tries to build/install the project itself.
[tool.uv]
package = false

# Local development only. Production is one Lambda behind API Gateway, which is what
# removed the container's ASGI server — so `fastapi`/`uvicorn` are deliberately **not**
# runtime dependencies. They exist so `make ai-assistant-local-agent` can serve the same
# `handler.lambda_handler` over HTTP on :8091, and the Makefile's RUNTIME_EXCLUDE
# subtracts them (and everything they pull in) from the Lambda zip, so they cost a
# deploy nothing.
[dependency-groups]
dev = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
