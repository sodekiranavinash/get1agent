    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme')
          var theme = stored === 'light' || stored === 'dark' ? stored : 'dark'
          document.documentElement.setAttribute('data-theme', theme)
          var icon = document.querySelector('link[rel="icon"][data-app-favicon]')
          if (icon) icon.setAttribute('href', theme === 'light' ? '/favicon-light.png' : '/favicon-dark.png')
        } catch (e) {}
      })()
    </script>
