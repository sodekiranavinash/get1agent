<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-dark.png" data-app-favicon />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>get1agent</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme')
          var theme = stored === 'light' || stored === 'dark' ? stored : 'dark'
          document.documentElement.setAttribute('data-theme', theme)
          var icon = document.querySelector('link[rel="icon"][data-app-favicon]')
          if (icon) icon.setAttribute('href', theme === 'light' ? '/favicon-light.png' : '/favicon-dark.png')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
