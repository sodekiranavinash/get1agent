# Floci (free, LocalStack-compatible AWS emulator) + DynamoDB Local for testing
# the serverless backend locally. No AWS account, no auth token, no Postgres.
#
#   make floci-build     # build Lambda zips (layers + services)
#   make floci-up        # start dynamodb + floci; init hook provisions resources
#   make floci-down      # stop and remove the stack (named volumes are kept)
#
# S3/Lambda/API state (Floci) and the DynamoDB table persist in the
# `floci_data` and `dynamodb_data` named volumes, so restarts keep uploaded
# documents and the retrieval index. Wipe everything with:
#   docker compose -f infra/local/floci/docker-compose.yml down -v
#
# Run `make floci-up` only after `make floci-build` (the init hook uploads the
# zips). See infra/local/floci/README.md for details.
name: get1agent-floci

services:
  # Operational data (single table + GSIs). Floci does not emulate DynamoDB.
  dynamodb:
    image: amazon/dynamodb-local:latest
    # Persist to a named volume so `make floci-down`/restarts do not wipe data.
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/home/dynamodblocal/data"]
    user: root
    volumes:
      - dynamodb_data:/home/dynamodblocal/data
    ports:
      - "${DYNAMODB_PORT:-8000}:8000"
    networks:
      - get1agent

  # Redis — the shared limiter (GCRA) and caches. Optional in production (every
  # caller falls back to DynamoDB/S3 Vectors when it is absent), but always on
  # locally so the Redis paths actually run.
  #
  # The **full stack** image (not plain `redis:8`) because the semantic cache
  # keeps a RediSearch vector index per user, matching a Redis Cloud instance
  # with the search module — the same commands run in both. Small and LRU-only
  # (mirroring the deployed 30 MB budget) and persistence off, because it holds
  # only ephemeral counters and rebuildable caches. `REDIS_ARGS` is how the
  # stack image forwards extra `redis-server` flags.
  redis:
    image: ${REDIS_IMAGE:-redis/redis-stack-server:latest}
    environment:
      REDIS_ARGS: ${REDIS_ARGS:---save '' --appendonly no --maxmemory ${REDIS_MAXMEMORY:-64mb} --maxmemory-policy ${REDIS_MAXMEMORY_POLICY:-allkeys-lru}}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - get1agent

  floci:
    # `-compat` bundles Python 3 + boto3 + the AWS CLI, which the init hook uses.
    image: ${FLOCI_IMAGE:-floci/floci:latest-compat}
    depends_on:
      - dynamodb
      - redis
    environment:
      FLOCI_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      # Browser-reachable hostname. Floci's embedded DNS resolves it inside
      # Lambda containers, and it resolves to 127.0.0.1 from the host/browser,
      # so presigned S3 URLs and the execute-api host work from both.
      FLOCI_HOSTNAME: ${FLOCI_HOSTNAME:-localhost.floci.io}
      # Persist S3/Lambda/API state to the /app/data volume so restarts keep
      # uploaded documents and the retrieval index (see `floci_data` below).
      FLOCI_STORAGE_MODE: ${FLOCI_STORAGE_MODE:-persistent}
      FLOCI_INIT_HOOKS_TIMEOUT_SECONDS: "${FLOCI_INIT_HOOKS_TIMEOUT_SECONDS:-300}"
      # How long Floci keeps an idle Lambda container warm. Floci's default is
      # 300s, which means any page untouched for 5 minutes pays a full cold
      # start on its next request (~3-4s per container: `docker create` plus the
      # Python/boto3 import). The admin MCP page invokes 5 containers, so a cold
      # load costs ~14s vs ~0.7s warm. An hour keeps the stack warm across a
      # normal dev session. Set 0 (or FLOCI_SERVICES_LAMBDA_EPHEMERAL=true) to
      # always cold-start.
      FLOCI_SERVICES_LAMBDA_CONTAINER_IDLE_TIMEOUT_SECONDS: "${FLOCI_SERVICES_LAMBDA_CONTAINER_IDLE_TIMEOUT_SECONDS:-3600}"
      FLOCI_DEFAULT_ACCOUNT_ID: ${FLOCI_DEFAULT_ACCOUNT_ID:-000000000000}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      # Real AWS credentials, resolved from your host chain and exported by
      # `make floci-up` (shell env wins over .env). `test` is the emulator
      # default when none are supplied. Forwarded into the Lambda containers by
      # the init hook so non-emulated services (Bedrock) reach real AWS.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      # Floci injects *emulated* execution-role credentials into Lambda containers,
      # so functions can't reach real AWS with just AWS_ACCESS_KEY_ID above. This
      # mount makes each Lambda discover the host's real ~/.aws credentials
      # (AWS_SHARED_CREDENTIALS_FILE), which the Labs use for real Bedrock.
      FLOCI_SERVICES_LAMBDA_AWS_CONFIG_PATH: ${HOME}/.aws
      # Read by the init hook (infra/local/floci/init/ready.d/10-provision.py).
      KB_BUCKET: ${S3_BUCKET:-get1agent-local}
      DYNAMODB_TABLE: ${DYNAMODB_TABLE:-get1agent-local}
      DYNAMODB_ENDPOINT_URL: ${DYNAMODB_ENDPOINT_URL:-http://dynamodb:8000}
      AUTH_ISSUER: ${AUTH_ISSUER:-https://get1agent.us.auth0.com/}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-https://api.get1agent.com}
      # Auth0 M2M apps (platform service + Management API). The init hook
      # forwards these onto the user-api/scheduler Lambdas.
      AGENT_SERVICE_CLIENT_ID: ${AGENT_SERVICE_CLIENT_ID:-}
      AGENT_SERVICE_CLIENT_SECRET: ${AGENT_SERVICE_CLIENT_SECRET:-}
      AUTH_MGMT_CLIENT_ID: ${AUTH_MGMT_CLIENT_ID:-}
      AUTH_MGMT_CLIENT_SECRET: ${AUTH_MGMT_CLIENT_SECRET:-}
      AGENT_RUN_FUNCTION: ${AGENT_RUN_FUNCTION:-}
      # Embeddings are always Amazon Titan on **real AWS** (the production
      # model) — the stack ships no offline embedder. Needs AWS credentials,
      # which the ~/.aws mount below provides, exactly like the Labs.
      EMBED_MODE: ${EMBED_MODE:-bedrock}
      TEXT_EMBED_MODEL: ${TEXT_EMBED_MODEL:-amazon.titan-embed-text-v2:0}
      IMAGE_EMBED_MODEL: ${IMAGE_EMBED_MODEL:-amazon.titan-embed-image-v1}
      EMBED_IMAGES: ${EMBED_IMAGES:-false}
      # Rerank backend: local (TEI) | none | bedrock (cross-region).
      RERANK_MODE: ${RERANK_MODE:-none}
      RERANK_REGION: ${RERANK_REGION:-us-west-2}
      RERANK_MODEL_ARN: ${RERANK_MODEL_ARN:-arn:aws:bedrock:us-west-2::foundation-model/amazon.rerank-v1:0}
      LOCAL_RERANK_URL: ${LOCAL_RERANK_URL:-http://reranker:80/rerank}
      # Remote MCP connections (GitHub OAuth App + callback overrides).
      MCP_GITHUB_CLIENT_ID: ${MCP_GITHUB_CLIENT_ID:-}
      MCP_GITHUB_CLIENT_SECRET: ${MCP_GITHUB_CLIENT_SECRET:-}
      # Optional GitHub token for skill repo resolution + registry imports
      # (user-api). Empty = anonymous, rate-limited.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      MCP_OAUTH_REDIRECT_URI: ${MCP_OAUTH_REDIRECT_URI:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      # HMAC secret for signed, expiring public trace links (user-api).
      TRACE_LINK_SECRET: ${TRACE_LINK_SECRET:-}
      # Best-effort cache (Redis first, DynamoDB TTL fallback) for embeddings +
      # search.
      CACHE_BACKEND: ${CACHE_BACKEND:-auto}
      CACHE_SEARCH_TTL_SECONDS: ${CACHE_SEARCH_TTL_SECONDS:-300}
      CACHE_EMBEDDING_TTL_SECONDS: ${CACHE_EMBEDDING_TTL_SECONDS:-2592000}
      # Redis (shared limiter + caches). The init hook forwards this onto the
      # Lambdas that enforce limits; production reads the URL from SSM instead.
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RATELIMIT_BACKEND: ${RATELIMIT_BACKEND:-auto}
      # Semantic cache: Redis RediSearch vector index (auto) / S3 Vectors ANN,
      # with the payload in the cache backend above.
      SEMANTIC_CACHE_BACKEND: ${SEMANTIC_CACHE_BACKEND:-auto}
      SEMANTIC_CACHE_ENABLED: ${SEMANTIC_CACHE_ENABLED:-true}
      SEMANTIC_CACHE_THRESHOLD: ${SEMANTIC_CACHE_THRESHOLD:-0.95}
      SEMANTIC_CACHE_TTL_SECONDS: ${SEMANTIC_CACHE_TTL_SECONDS:-600}
      SEMANTIC_CACHE_MAX_BYTES: ${SEMANTIC_CACHE_MAX_BYTES:-200000}
      # Single-flight locks to dedupe concurrent identical work.
      SINGLE_FLIGHT_ENABLED: ${SINGLE_FLIGHT_ENABLED:-true}
      SINGLE_FLIGHT_LOCK_SECONDS: ${SINGLE_FLIGHT_LOCK_SECONDS:-20}
      SINGLE_FLIGHT_WAIT_SECONDS: ${SINGLE_FLIGHT_WAIT_SECONDS:-6}
      # Playground custom-tool code generation + evals (user-api) run on Amazon
      # Bedrock (IAM-authenticated; local containers need AWS credentials).
      BEDROCK_REGION: ${BEDROCK_REGION:-ap-south-1}
      BEDROCK_CHAT_MODEL: ${BEDROCK_CHAT_MODEL:-zai.glm-4.7-flash}
      # Floci's bedrock-runtime is a stub, so the Labs must reach real Bedrock.
      # boto3's service-specific endpoint wins over the global AWS_ENDPOINT_URL
      # (http://floci:4566) that Floci injects into every Lambda.
      AWS_ENDPOINT_URL_BEDROCK_RUNTIME: ${AWS_ENDPOINT_URL_BEDROCK_RUNTIME:-}
      AGENT_MEMORY_BACKEND: ${AGENT_MEMORY_BACKEND:-dynamo}
      MCP_TRANSPORT: ${MCP_TRANSPORT:-aggregator}
      AGENT_WORKLOAD_IDENTITY_ARN: ${AGENT_WORKLOAD_IDENTITY_ARN:-}
      AGENT_TOKEN_VAULT_ID: ${AGENT_TOKEN_VAULT_ID:-}
      AGENT_IDENTITY_PROVIDERS: ${AGENT_IDENTITY_PROVIDERS:-}
      AGENT_IDENTITY_RETURN_URL: ${AGENT_IDENTITY_RETURN_URL:-}
      MCP_GATEWAY_URL: ${MCP_GATEWAY_URL:-}
      AGENTCORE_MEMORY_ID: ${AGENTCORE_MEMORY_ID:-}
      AGENT_POLICY_ENGINE: ${AGENT_POLICY_ENGINE:-}
      AGENT_POLICY_MODE: ${AGENT_POLICY_MODE:-enforce}
      AGENT_POLICY_DENY_TOOLS: ${AGENT_POLICY_DENY_TOOLS:-}
      GUARDRAIL_ID: ${GUARDRAIL_ID:-}
      GUARDRAIL_VERSION: ${GUARDRAIL_VERSION:-DRAFT}
      CUSTOM_TOOLS_GENERATOR_MODEL: ${CUSTOM_TOOLS_GENERATOR_MODEL:-zai.glm-4.7-flash}
      CUSTOM_TOOLS_GENERATE_MAX_TOKENS: ${CUSTOM_TOOLS_GENERATE_MAX_TOKENS:-32000}
      CUSTOM_TOOLS_GENERATE_TIMEOUT_SECONDS: ${CUSTOM_TOOLS_GENERATE_TIMEOUT_SECONDS:-25}
      CUSTOM_TOOLS_GENERATE_ASYNC_TIMEOUT_SECONDS: ${CUSTOM_TOOLS_GENERATE_ASYNC_TIMEOUT_SECONDS:-240}
      # Eval lab models + limits.
      EVAL_ANSWER_MODEL: ${EVAL_ANSWER_MODEL:-amazon.nova-2-lite-v1:0}
      EVAL_JUDGE_MODEL: ${EVAL_JUDGE_MODEL:-amazon.nova-2-lite-v1:0}
      EVAL_MAX_CASES_PER_RUN: ${EVAL_MAX_CASES_PER_RUN:-20}
      # Local embeddings tunables (ingestion).
      EMBED_DIM: ${EMBED_DIM:-1024}
      EMBED_MAX_WORKERS: ${EMBED_MAX_WORKERS:-4}
      EMBED_MAX_ATTEMPTS: ${EMBED_MAX_ATTEMPTS:-6}
      # Local reranker (TEI) knobs.
      LOCAL_RERANK_TIMEOUT_SECONDS: ${LOCAL_RERANK_TIMEOUT_SECONDS:-60}
      LOCAL_RERANK_BATCH_SIZE: ${LOCAL_RERANK_BATCH_SIZE:-32}
      # HTTP fetch (optional host allowlist; empty allows any public host).
      HTTP_FETCH_ALLOWED_DOMAINS: ${HTTP_FETCH_ALLOWED_DOMAINS:-}
      # Vault (allows testing a local provider key, e.g. Ollama).
      VAULT_TEST_TIMEOUT_SECONDS: ${VAULT_TEST_TIMEOUT_SECONDS:-15}
      VAULT_ALLOW_PRIVATE_URLS: ${VAULT_ALLOW_PRIVATE_URLS:-true}
      # Code interpreter + custom tools (Floci runs both as guarded subprocesses).
      CODE_INTERPRETER_MODE: ${CODE_INTERPRETER_MODE:-local}
      CODE_INTERPRETER_EXEC_TIMEOUT_SECONDS: ${CODE_INTERPRETER_EXEC_TIMEOUT_SECONDS:-120}
      CUSTOM_TOOLS_MODE: ${CUSTOM_TOOLS_MODE:-local}
      CUSTOM_TOOLS_EXEC_TIMEOUT_SECONDS: ${CUSTOM_TOOLS_EXEC_TIMEOUT_SECONDS:-90}
      CUSTOM_TOOLS_TEST_EXEC_TIMEOUT_SECONDS: ${CUSTOM_TOOLS_TEST_EXEC_TIMEOUT_SECONDS:-180}
      CUSTOM_TOOLS_ALLOW_NETWORK: ${CUSTOM_TOOLS_ALLOW_NETWORK:-true}
      CUSTOM_TOOLS_MAX_CONNECTIONS: ${CUSTOM_TOOLS_MAX_CONNECTIONS:-25}
      CUSTOM_TOOLS_RUNS_PER_HOUR: ${CUSTOM_TOOLS_RUNS_PER_HOUR:-60}
      CUSTOM_TOOLS_SESSION_TIMEOUT_SECONDS: ${CUSTOM_TOOLS_SESSION_TIMEOUT_SECONDS:-900}
      CUSTOM_TOOLS_MAX_SESSIONS_PER_USER: ${CUSTOM_TOOLS_MAX_SESSIONS_PER_USER:-1}
      CUSTOM_TOOLS_MAX_CODE_BYTES: ${CUSTOM_TOOLS_MAX_CODE_BYTES:-65536}
      CUSTOM_TOOLS_MAX_OUTPUT_CHARS: ${CUSTOM_TOOLS_MAX_OUTPUT_CHARS:-50000}
      CUSTOM_TOOLS_MAX_RESULT_CHARS: ${CUSTOM_TOOLS_MAX_RESULT_CHARS:-20000}
      BLOCKED_MODULES: ${BLOCKED_MODULES:-}
      ALLOWED_MODULES: ${ALLOWED_MODULES:-}
      # Registries (optional overrides; code defaults apply when blank).
      MCP_REGISTRY_URL: ${MCP_REGISTRY_URL:-https://registry.modelcontextprotocol.io}
      SKILLS_REGISTRY_URL: ${SKILLS_REGISTRY_URL:-https://api.claude-plugins.dev}
      # Scheduler + watchdog rules (AgentCore is not emulated locally; leave off).
      ENABLE_LOCAL_SCHEDULER: ${ENABLE_LOCAL_SCHEDULER:-false}
      ENABLE_LOCAL_WATCHDOG: ${ENABLE_LOCAL_WATCHDOG:-false}
    ports:
      - "${FLOCI_PORT:-4566}:4566"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./init:/etc/floci/init:ro
      - ../../../backend:/opt/get1agent/backend:ro
      - ../../../infra:/opt/get1agent/infra:ro
      - floci_data:/app/data
    networks:
      - get1agent

  # Agent runtime (the AgentCore app) running continuously like the Lambdas, so
  # there is no `make agent`. It starts with the stack; after agent-side code
  # changes run `make floci-reload` (rebuilds this image + re-provisions Floci).
  agent:
    build:
      context: ../../../backend
      dockerfile: agents/Dockerfile
    depends_on:
      - dynamodb
      - floci
      - redis
    # All local agent config comes from the repo-root .env …
    env_file:
      - ../../../.env
    environment:
      # … with the compose-network endpoints overriding the host-oriented ones.
      DYNAMODB_ENDPOINT_URL: http://dynamodb:8000
      AWS_ENDPOINT_URL: http://floci:4566
      S3_ENDPOINT_URL: http://floci:4566
      # X-Ray is real AWS, not Floci: override the global endpoint for it only.
      AWS_ENDPOINT_URL_XRAY: https://xray.us-east-1.amazonaws.com
      # Docker can't resolve the virtual-host style bucket host, so use path style.
      S3_ADDRESSING_STYLE: path
      AGENT_PORT: "8080"
      # Real AWS credentials (Bedrock + X-Ray). `make floci-up` / `make agent`
      # export the host chain and an explicit export always wins. Otherwise the
      # host's ~/.aws is mounted below, so the container reads *live* credentials
      # (and an SSO refresh) instead of a snapshot baked in at create time —
      # a stale/baked credential used to surface as UnrecognizedClientException
      # on every ConverseStream call.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    volumes:
      # Live host AWS credentials for the real Bedrock/X-Ray calls. Read-only.
      - ${HOME}/.aws:/root/.aws:ro
    ports:
      - "${AGENT_PORT:-8090}:8080"
    networks:
      - get1agent

  # AI Assistant — the bottom-right assistant. Production is one Lambda behind two
  # API Gateway routes, but its zip is built from the **host's** wheels, and on a
  # Mac those are macOS binaries that Floci's Linux Lambda containers cannot
  # import. So locally it runs as this service instead: `main.py` serves the same
  # `handler.lambda_handler` over HTTP, from the committed uv.lock, on Linux.
  #
  # It is part of the stack — `make floci`/`floci-up` starts it, `make
  # floci-reload` rebuilds it after code changes, and `make floci-logs` /
  # `make ai-assistant-logs` follow it — so there is no separate terminal to keep
  # open, the same reasoning that put `oauth-proxy` here.
  ai-assistant:
    build:
      context: ../../../backend
      # Local-only image: the Lambda zip is the deployable.
      dockerfile: ai-assistant/Dockerfile.dev
    depends_on:
      - dynamodb
      - floci
      - redis
    # All local assistant config starts from the repo-root .env …
    env_file:
      - ../../../.env
    environment:
      # … with the compose-network endpoints overriding the host-oriented ones.
      DYNAMODB_ENDPOINT_URL: http://dynamodb:8000
      DYNAMODB_TABLE: ${DYNAMODB_TABLE:-get1agent-local}
      AWS_ENDPOINT_URL: http://floci:4566
      S3_ENDPOINT_URL: http://floci:4566
      S3_ADDRESSING_STYLE: path
      S3_BUCKET: ${S3_BUCKET:-get1agent-local}
      S3_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      # Retrieval uses the local vector store. The caches stay **on** and point
      # at the stack's Redis — the same backend production uses — so a repeated
      # question takes the path a real user gets. Set CACHE_BACKEND=none in .env
      # to force fresh retrieval. Embeddings are always Amazon Titan on real AWS
      # (`bedrock`), so this service and the ingestion workers cannot disagree
      # about which model wrote the vectors.
      EMBED_MODE: ${EMBED_MODE:-bedrock}
      VECTOR_STORE: local
      CACHE_BACKEND: ${CACHE_BACKEND:-auto}
      SEMANTIC_CACHE_BACKEND: ${SEMANTIC_CACHE_BACKEND:-auto}
      SEMANTIC_CACHE_ENABLED: ${SEMANTIC_CACHE_ENABLED:-true}
      SEMANTIC_CACHE_THRESHOLD: ${SEMANTIC_CACHE_THRESHOLD:-0.95}
      SEMANTIC_CACHE_TTL_SECONDS: ${SEMANTIC_CACHE_TTL_SECONDS:-600}
      # Per-caller fairness limiter: Redis GCRA locally, so the refusal path the
      # deployed Lambda uses is the one a developer meets.
      REDIS_URL: redis://redis:6379/0
      RATELIMIT_BACKEND: ${RATELIMIT_BACKEND:-auto}
      # The reserved platform scope the corpus is ingested into.
      AI_ASSISTANT_SCOPE: platform
      AI_ASSISTANT_KB_ID: kb_platform_docs_0001
      # Bedrock stays **real AWS**, like the agent service: Floci rejects
      # ConverseStream, and the global AWS_ENDPOINT_URL above would otherwise
      # send every model call to the emulator. A service-specific endpoint wins
      # over the global one, which is what keeps these off Floci.
      BEDROCK_REGION: ${BEDROCK_REGION:-ap-south-1}
      AWS_ENDPOINT_URL_BEDROCK_RUNTIME: https://bedrock-runtime.${BEDROCK_REGION:-ap-south-1}.amazonaws.com
      AWS_ENDPOINT_URL_BEDROCK_AGENT_RUNTIME: https://bedrock-agent-runtime.us-west-2.amazonaws.com
      # Reranking follows the stack's own switch (RERANK_MODE in .env), which is
      # `none` by default — deliberately. Bedrock Rerank is not offered in
      # ap-south-1, and the cross-region model is throttled for this account, so a
      # reranking turn pays ~6-26s of boto3 adaptive retries and *then* falls back
      # to the RRF order anyway: the same ranking, tens of seconds worse. To
      # exercise real reranking locally, start the cross-encoder the stack ships
      # (`make floci-rerank`, profile `local-rerank`) and set RERANK_MODE=local —
      # `LOCAL_RERANK_URL` below is the container's view of that service.
      RERANK_MODE: ${RERANK_MODE:-none}
      LOCAL_RERANK_URL: http://reranker:80/rerank
      # The ASGI server stands in for API Gateway, so *it* verifies the browser's
      # Auth0 token on `/ask`. Same tenant the SPA signs in to.
      AI_ASSISTANT_AUTH_ISSUER: ${AUTH_ISSUER:-https://get1agent.us.auth0.com/}
      AI_ASSISTANT_AUTH_AUDIENCE: ${AUTH_AUDIENCE:-https://api.get1agent.com}
      # Local development raises the ceilings the deployed caps exist to protect:
      # a developer would hit the shipped guest allowance (6/hour per IP) within a
      # few questions and reasonably conclude the assistant was broken. The first
      # turn also pays the framework's import cost, which the deployed 24s budget
      # (sized for API Gateway's 30s integration cap) would fail — there is no
      # gateway here, so the ceiling moves out instead. `main.py` pre-warms the
      # framework in the background so this is a backstop, not the mechanism.
      AI_ASSISTANT_TURN_BUDGET_SECONDS: "120"
      AI_ASSISTANT_GUEST_PER_HOUR: "200"
      AI_ASSISTANT_GUEST_PER_DAY: "1000"
      AI_ASSISTANT_PER_HOUR: "500"
      AI_ASSISTANT_PER_DAY: "5000"
      # Real AWS credentials (Bedrock). `make floci-up`/`floci-reload` export the
      # host chain and an explicit export always wins; otherwise the host's
      # ~/.aws is mounted below, so the container reads *live* credentials.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    volumes:
      - ${HOME}/.aws:/root/.aws:ro
    ports:
      # **Loopback only.** `main.py` is what verifies the JWT on `/ask`, so this
      # service must never be reachable from another machine — the compose
      # equivalent of the host runner's refusal to bind a non-loopback address.
      - "127.0.0.1:${AI_ASSISTANT_PORT:-8091}:8091"
    networks:
      - get1agent
    restart: unless-stopped

  # Loopback OAuth callback forwarder for remote MCP servers (GitHub, Linear…).
  # Providers only allow plaintext-HTTP redirects to a loopback address, but
  # Floci serves the API on its own host. This publishes 127.0.0.1:8765 and
  # rewrites the Host header to the Floci execute-api host, so the provider's
  # redirect lands on Floci and is 302'd back to the SPA. It is part of the
  # stack: started by `make floci`/`floci-up` and left running by `floci-reload`
  # (so there is no separate terminal to keep open).
  oauth-proxy:
    image: ${OAUTH_PROXY_IMAGE:-python:3.12-alpine}
    command:
      [
        "python3",
        "/opt/oauth-loopback.py",
        "--bind",
        "0.0.0.0",
        "--port",
        "8765",
        "--floci-host",
        "floci",
        "--floci-port",
        "4566",
      ]
    depends_on:
      - floci
    ports:
      # Loopback only: the provider redirects the browser to 127.0.0.1.
      - "127.0.0.1:${OAUTH_PROXY_PORT:-8765}:8765"
    volumes:
      - ./oauth-loopback.py:/opt/oauth-loopback.py:ro
    networks:
      - get1agent
    restart: unless-stopped

  # Real cross-encoder reranker for local retrieval (mirrors Bedrock Rerank
  # Rerank). HuggingFace Text Embeddings Inference serves POST /rerank. Opt-in
  # profile: only started for RERANK_MODE=local.
  reranker:
    image: ${RERANKER_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.9}
    profiles: ["local-rerank"]
    command:
      [
        "--model-id",
        "${LOCAL_RERANK_MODEL:-cross-encoder/ms-marco-MiniLM-L6-v2}",
        "--port",
        "80",
      ]
    ports:
      - "${RERANKER_PORT:-8080}:80"
    volumes:
      - reranker_models:/data
    networks:
      - get1agent

networks:
  get1agent:
    name: get1agent-floci

volumes:
  floci_data:
  dynamodb_data:
  reranker_models:
