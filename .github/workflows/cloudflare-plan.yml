name: Cloudflare plan

# Read-only plan for review. This is the "read the plan before you apply" half of
# the Cloudflare workflow — the apply lives in infra.yml behind workflow_dispatch.
# It never writes to Cloudflare or to Terraform state.
on:
  pull_request:
    paths:
      - "infra/terraform/envs/cloudflare/**"
      - "infra/aws/write-cloudflare-tfvars.sh"
      - "infra/aws/run-terraform.sh"
      - ".github/workflows/cloudflare-plan.yml"
  workflow_dispatch:

concurrency:
  group: cloudflare-plan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  AWS_REGION: ap-south-1
  TF_IN_AUTOMATION: "true"
  TF_STATE_BUCKET: get1agent-terraform-state-ap-south-1

jobs:
  plan:
    name: Terraform plan (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Terraform needs AWS credentials for the S3 state backend, the Cloudflare
      # read-only token for the provider, and the zone id for the tfvars. Until
      # all of them exist this job warns and skips rather than failing on every
      # PR that touches the env.
      - name: Check credentials are configured
        id: creds
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_READONLY }}
          AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          CF_ZONE: ${{ vars.CLOUDFLARE_ZONE_ID }}
        run: |
          missing=""
          [[ -z "$CF_TOKEN" ]] && missing="$missing CLOUDFLARE_API_TOKEN_READONLY(secret)"
          [[ -z "$AWS_KEY" ]] && missing="$missing AWS_ACCESS_KEY_ID(secret)"
          [[ -z "$CF_ZONE" ]] && missing="$missing CLOUDFLARE_ZONE_ID(variable)"
          if [[ -n "$missing" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Cloudflare plan skipped — not configured yet:$missing"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Read Terraform version
        if: steps.creds.outputs.skip == 'false'
        id: tfver
        run: echo "version=$(tr -d '[:space:]' < infra/terraform/.terraform-version)" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        if: steps.creds.outputs.skip == 'false'
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ steps.tfver.outputs.version }}
          terraform_wrapper: false

      - name: Terraform fmt
        if: steps.creds.outputs.skip == 'false'
        run: terraform fmt -check -recursive infra/terraform

      - name: Configure AWS credentials
        if: steps.creds.outputs.skip == 'false'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Write cloudflare terraform.tfvars
        if: steps.creds.outputs.skip == 'false'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_ZONE_NAME: ${{ vars.CLOUDFLARE_ZONE_NAME }}
        run: bash infra/aws/write-cloudflare-tfvars.sh

      - name: Terraform plan
        if: steps.creds.outputs.skip == 'false'
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN_READONLY }}
        run: |
          cd infra/terraform/envs/cloudflare
          terraform init -input=false -no-color -reconfigure
          terraform plan -input=false -no-color -lock-timeout=5m | tee plan.txt
          {
            echo "## Cloudflare plan"
            echo ""
            echo "Review before applying: a non-empty plan here is real DNS/rules change."
            echo ""
            echo '```terraform'
            tail -c 60000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
