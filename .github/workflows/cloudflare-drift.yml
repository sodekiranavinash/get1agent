name: Cloudflare drift

# The control that keeps repo and Cloudflare matching after adoption. Without it
# a dashboard edit silently diverges until the next unrelated apply. A non-empty
# plan (exit code 2) fails the run.
on:
  schedule:
    # Daily, off-peak. Zone settings and rules are eventually consistent, so a
    # single run a day is enough to catch out-of-band edits.
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: cloudflare-drift
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  TF_IN_AUTOMATION: "true"
  TF_STATE_BUCKET: get1agent-terraform-state-ap-south-1

jobs:
  drift:
    name: Detect drift
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check credentials are configured
        id: creds
        env:
          CF_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CF_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
        run: |
          missing=""
          [[ -z "$CF_KEY" ]] && missing="$missing CLOUDFLARE_API_KEY(secret)"
          [[ -z "$CF_EMAIL" ]] && missing="$missing CLOUDFLARE_EMAIL(secret)"
          [[ -z "$AWS_KEY" ]] && missing="$missing AWS_ACCESS_KEY_ID(secret)"
          if [[ -n "$missing" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Drift detection skipped — not configured yet:$missing"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Read Terraform version
        if: steps.creds.outputs.skip == 'false'
        id: tfver
        run: echo "version=$(tr -d '[:space:]' < infra/terraform/.terraform-version)" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        if: steps.creds.outputs.skip == 'false'
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ steps.tfver.outputs.version }}
          terraform_wrapper: false

      - name: Configure AWS credentials
        if: steps.creds.outputs.skip == 'false'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Write cloudflare terraform.tfvars
        if: steps.creds.outputs.skip == 'false'
        run: bash infra/aws/write-cloudflare-tfvars.sh

      - name: Terraform plan (detailed exit code)
        if: steps.creds.outputs.skip == 'false'
        env:
          TF_VAR_cloudflare_api_key: ${{ secrets.CLOUDFLARE_API_KEY }}
          TF_VAR_cloudflare_email: ${{ secrets.CLOUDFLARE_EMAIL }}
        run: |
          cd infra/terraform/envs/cloudflare
          terraform init -input=false -no-color -reconfigure

          # -detailed-exitcode: 0 = no changes, 2 = drift, 1 = error.
          set +e
          terraform plan -input=false -no-color -detailed-exitcode -lock-timeout=5m | tee plan.txt
          rc=${PIPESTATUS[0]}
          set -e

          {
            echo "## Cloudflare drift check"
            echo ""
            echo '```terraform'
            tail -c 60000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          case "$rc" in
            0)
              echo "No drift: Cloudflare matches the repository."
              ;;
            2)
              echo "::error::Drift detected - Cloudflare no longer matches infra/terraform/envs/cloudflare. Somebody changed the dashboard, or an apply was missed. Reconcile the config, or import the change, then apply."
              exit 1
              ;;
            *)
              echo "::error::terraform plan failed with exit code $rc."
              exit 1
              ;;
          esac
