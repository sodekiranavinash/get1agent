name: Deploy control_plane

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "control_plane/**"
      - "infra/aws/sync-ec2-api.sh"
      - "infra/aws/render-deploy-api.sh"
      - "infra/terraform/modules/data_plane/**"
      - ".github/workflows/deploy-control-plane.yml"

concurrency:
  group: deploy-control-plane
  cancel-in-progress: true

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  TF_STATE_BUCKET: get1agent-terraform-state-us-east-1

jobs:
  deploy:
    name: Build & deploy control_plane to EC2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.0"
          terraform_wrapper: false

      - name: Read ECR and EC2 targets
        id: targets
        working-directory: infra/terraform/envs/dev
        run: |
          terraform init -input=false -no-color
          if ! terraform output -raw ecr_repository_url >/dev/null 2>&1; then
            echo "Data plane not deployed. Run Infra workflow with DATA_PLANE_SSH_CIDR secret first." >&2
            exit 1
          fi
          echo "ecr=$(terraform output -raw ecr_repository_url)" >> "$GITHUB_OUTPUT"
          echo "instance=$(terraform output -raw app_instance_id)" >> "$GITHUB_OUTPUT"
          echo "api_url=$(terraform output -raw api_base_url)" >> "$GITHUB_OUTPUT"

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image (ARM64 for t4g EC2)
        env:
          ECR_URL: ${{ steps.targets.outputs.ecr }}
        run: |
          docker buildx build \
            --platform linux/arm64 \
            -t "$ECR_URL:latest" \
            --push \
            control_plane

      - name: Deploy on EC2 via SSM
        run: bash infra/aws/sync-ec2-api.sh

      - name: Verify health endpoint
        env:
          API_URL: ${{ steps.targets.outputs.api_url }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl -sf "${API_URL}/health"; then
              echo ""
              echo "Health check passed on attempt ${attempt}"
              exit 0
            fi
            echo "Waiting for API (attempt ${attempt}/6)..."
            sleep 10
          done
          echo "Health check failed: ${API_URL}/health" >&2
          exit 1

      - name: Summary
        run: |
          echo "## control_plane deployed (IAM DB auth)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Health: ${{ steps.targets.outputs.api_url }}/health" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ready (DB via IAM): ${{ steps.targets.outputs.api_url }}/ready" >> "$GITHUB_STEP_SUMMARY"
          echo "- Docs: ${{ steps.targets.outputs.api_url }}/docs" >> "$GITHUB_STEP_SUMMARY"
