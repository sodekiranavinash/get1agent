name: Tools

on:
  workflow_dispatch:
    inputs:
      challan_extractor:
        description: Deploy challan-extractor
        type: boolean
        default: true

concurrency:
  group: tools-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  pick:
    name: Resolve tools
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.matrix.outputs.include }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build matrix
        id: matrix
        env:
          SELECT_CHALLAN_EXTRACTOR: ${{ inputs.challan_extractor }}
        run: |
          include="$(bash infra/aws/build-tools-matrix.sh)"
          echo "Deploying: $include"
          {
            echo "include<<EOF"
            echo "$include"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  deploy:
    name: ${{ matrix.name }}
    needs: pick
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.pick.outputs.include) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.tool_dir }}/go.mod
          cache-dependency-path: ${{ matrix.tool_dir }}/go.sum

      - name: Package
        run: make package
        working-directory: ${{ matrix.tool_dir }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy Lambda
        env:
          FUNCTION_NAME: ${{ matrix.function_name }}
          ZIP: ${{ matrix.tool_dir }}/dist/function.zip
        run: |
          if ! aws lambda get-function --function-name "$FUNCTION_NAME" >/dev/null; then
            echo "Function $FUNCTION_NAME does not exist. Run Infra with Lambdas checked first." >&2
            exit 1
          fi
          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --zip-file "fileb://$ZIP"
          aws lambda wait function-updated --function-name "$FUNCTION_NAME"
          aws lambda get-function --function-name "$FUNCTION_NAME" \
            --query 'Configuration.{FunctionName:FunctionName,LastModified:LastModified,CodeSize:CodeSize}' \
            --output table
