name: Deploy Backend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "control_plane/**"
      - ".github/workflows/deploy-backend.yml"

concurrency:
  group: deploy-control-plane
  cancel-in-progress: true

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  TF_STATE_BUCKET: get1agent-terraform-state-us-east-1

jobs:
  deploy:
    name: Build & deploy control_plane to EC2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.0"
          terraform_wrapper: false

      - name: Read ECR and EC2 targets
        id: targets
        working-directory: infra/terraform/envs/dev
        run: |
          terraform init -input=false -no-color
          if ! terraform output -raw ecr_repository_url >/dev/null 2>&1; then
            echo "Data plane not deployed. Run Infra workflow with DATA_PLANE_SSH_CIDR secret first." >&2
            exit 1
          fi
          echo "ecr=$(terraform output -raw ecr_repository_url)" >> "$GITHUB_OUTPUT"
          echo "instance=$(terraform output -raw app_instance_id)" >> "$GITHUB_OUTPUT"
          echo "api_url=$(terraform output -raw api_base_url)" >> "$GITHUB_OUTPUT"

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_URL: ${{ steps.targets.outputs.ecr }}
        run: |
          docker build -t "$ECR_URL:latest" control_plane
          docker push "$ECR_URL:latest"

      - name: Deploy on EC2 via SSM
        env:
          INSTANCE_ID: ${{ steps.targets.outputs.instance }}
        run: |
          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy get1agent control_plane" \
            --parameters commands='["/opt/get1agent/deploy-api.sh"]' \
            --query Command.CommandId \
            --output text)"

          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"

          STATUS="$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query Status \
            --output text)"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent \
            --output text

          if [[ "$STATUS" != "Success" ]]; then
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query StandardErrorContent \
              --output text
            exit 1
          fi

      - name: Summary
        run: |
          echo "## control_plane deployed (IAM DB auth)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Health: ${{ steps.targets.outputs.api_url }}/health" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ready (DB via IAM): ${{ steps.targets.outputs.api_url }}/ready" >> "$GITHUB_STEP_SUMMARY"
          echo "- Docs: ${{ steps.targets.outputs.api_url }}/docs" >> "$GITHUB_STEP_SUMMARY"
