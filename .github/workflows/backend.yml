name: Backend

on:
  workflow_dispatch:
    inputs:
      user_apis:
        description: User APIs (user-api)
        type: boolean
        default: true
      knowledge_mcp:
        description: Knowledge MCP (knowledge-mcp)
        type: boolean
        default: false
      admin_apis:
        description: Admin APIs (mcp-tester)
        type: boolean
        default: false
      mcp_tools:
        description: MCP tools (web-search, code-interpreter)
        type: boolean
        default: false
      ingestion_apis:
        description: Ingestion APIs (dispatcher, extract, embed, index, mark-failed, watchdog)
        type: boolean
        default: false

concurrency:
  group: backend-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1

jobs:
  pick:
    name: Resolve lambdas
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.matrix.outputs.include }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build matrix
        id: matrix
        env:
          SELECT_USER_APIS: ${{ inputs.user_apis }}
          SELECT_KNOWLEDGE_MCP: ${{ inputs.knowledge_mcp }}
          SELECT_ADMIN_APIS: ${{ inputs.admin_apis }}
          SELECT_MCP_TOOLS: ${{ inputs.mcp_tools }}
          SELECT_INGESTION_APIS: ${{ inputs.ingestion_apis }}
        run: |
          include="$(bash infra/aws/build-backend-matrix.sh)"
          echo "Deploying: $include"
          {
            echo "include<<EOF"
            echo "$include"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  deploy:
    name: ${{ matrix.name }}
    needs: pick
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.pick.outputs.include) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Package handler zip
        run: make package
        working-directory: ${{ matrix.lambda_dir }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy Lambda
        env:
          FUNCTION_NAME: ${{ matrix.function_name }}
          ZIP: ${{ matrix.lambda_dir }}/dist/function.zip
        run: |
          if ! aws lambda get-function --function-name "$FUNCTION_NAME" >/dev/null; then
            echo "Function $FUNCTION_NAME does not exist. Run Infra with Lambdas checked first." >&2
            exit 1
          fi
          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --zip-file "fileb://$ZIP"
          aws lambda wait function-updated --function-name "$FUNCTION_NAME"
          aws lambda get-function --function-name "$FUNCTION_NAME" \
            --query 'Configuration.{FunctionName:FunctionName,LastModified:LastModified,CodeSize:CodeSize}' \
            --output table
