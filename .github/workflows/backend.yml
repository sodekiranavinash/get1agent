name: Backend

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Upload to Lambda (uncheck for package/test only)
        type: boolean
        default: true
      force:
        description: Upload even if zip SHA already matches live function
        type: boolean
        default: false
      health_check:
        description: backend/health-check (get1agent-prod-health-check)
        type: boolean
        default: true

concurrency:
  group: backend-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  pick:
    name: Resolve lambdas
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.matrix.outputs.include }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build matrix
        id: matrix
        env:
          SELECT_HEALTH_CHECK: ${{ inputs.health_check }}
        run: |
          include="$(bash infra/aws/build-backend-matrix.sh)"
          echo "Selected: $include"
          {
            echo "include<<EOF"
            echo "$include"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  deploy:
    name: ${{ matrix.name }}
    needs: pick
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.pick.outputs.include) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test and package
        run: make package
        working-directory: ${{ matrix.lambda_dir }}

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.function_name }}-zip
          path: ${{ matrix.lambda_dir }}/dist/function.zip

      - name: Configure AWS credentials
        if: inputs.deploy
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update Lambda code
        if: inputs.deploy
        env:
          FUNCTION_NAME: ${{ matrix.function_name }}
          ZIP: ${{ matrix.lambda_dir }}/dist/function.zip
          FORCE: ${{ inputs.force }}
        run: |
          if ! aws lambda get-function --function-name "$FUNCTION_NAME" >/dev/null; then
            echo "Function $FUNCTION_NAME does not exist. Run Infra with Prod checked first." >&2
            exit 1
          fi

          local_sha="$(python3 -c "import base64,hashlib,pathlib,sys; p=pathlib.Path(sys.argv[1]); print(base64.b64encode(hashlib.sha256(p.read_bytes()).digest()).decode())" "$ZIP")"
          remote_sha="$(aws lambda get-function-configuration --function-name "$FUNCTION_NAME" --query CodeSha256 --output text)"
          echo "local  CodeSha256=$local_sha"
          echo "remote CodeSha256=$remote_sha"

          if [[ "$FORCE" != "true" && "$local_sha" == "$remote_sha" ]]; then
            echo "Zip matches live function; skipping upload."
            exit 0
          fi

          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --zip-file "fileb://$ZIP"
          aws lambda wait function-updated --function-name "$FUNCTION_NAME"
          aws lambda get-function --function-name "$FUNCTION_NAME" \
            --query 'Configuration.{FunctionName:FunctionName,LastModified:LastModified,CodeSize:CodeSize,CodeSha256:CodeSha256}' \
            --output table
