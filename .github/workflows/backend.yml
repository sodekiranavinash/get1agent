name: Backend

on:
  workflow_dispatch:
    inputs:
      health_check:
        description: Deploy health-check
        type: boolean
        default: true
      migration_runner:
        description: Deploy migration-runner
        type: boolean
        default: false
      account_settings:
        description: Deploy account-settings
        type: boolean
        default: false
      knowledge_bases:
        description: Deploy knowledge-bases
        type: boolean
        default: false
      ingestion_dispatcher:
        description: Deploy ingestion-dispatcher
        type: boolean
        default: false
      ingestion_extract:
        description: Deploy ingestion-extract
        type: boolean
        default: false
      ingestion_index:
        description: Deploy ingestion-index
        type: boolean
        default: false
      ingestion_mark_failed:
        description: Deploy ingestion-mark-failed
        type: boolean
        default: false

concurrency:
  group: backend-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1

jobs:
  pick:
    name: Resolve lambdas
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.matrix.outputs.include }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build matrix
        id: matrix
        env:
          SELECT_HEALTH_CHECK: ${{ inputs.health_check }}
          SELECT_MIGRATION_RUNNER: ${{ inputs.migration_runner }}
          SELECT_ACCOUNT_SETTINGS: ${{ inputs.account_settings }}
          SELECT_KNOWLEDGE_BASES: ${{ inputs.knowledge_bases }}
          SELECT_INGESTION_DISPATCHER: ${{ inputs.ingestion_dispatcher }}
          SELECT_INGESTION_EXTRACT: ${{ inputs.ingestion_extract }}
          SELECT_INGESTION_INDEX: ${{ inputs.ingestion_index }}
          SELECT_INGESTION_MARK_FAILED: ${{ inputs.ingestion_mark_failed }}
        run: |
          include="$(bash infra/aws/build-backend-matrix.sh)"
          echo "Deploying: $include"
          {
            echo "include<<EOF"
            echo "$include"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  deploy:
    name: ${{ matrix.name }}
    needs: pick
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.pick.outputs.include) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Package handler zip
        run: make package
        working-directory: ${{ matrix.lambda_dir }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy Lambda
        env:
          FUNCTION_NAME: ${{ matrix.function_name }}
          ZIP: ${{ matrix.lambda_dir }}/dist/function.zip
        run: |
          if ! aws lambda get-function --function-name "$FUNCTION_NAME" >/dev/null; then
            echo "Function $FUNCTION_NAME does not exist. Run Infra with Lambdas checked first." >&2
            exit 1
          fi
          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --zip-file "fileb://$ZIP"
          aws lambda wait function-updated --function-name "$FUNCTION_NAME"
          aws lambda get-function --function-name "$FUNCTION_NAME" \
            --query 'Configuration.{FunctionName:FunctionName,LastModified:LastModified,CodeSize:CodeSize}' \
            --output table
