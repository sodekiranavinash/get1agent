name: Migrate

# Runs an Alembic upgrade/downgrade against the production RDS database from the
# existing jumpbox EC2 (which is inside the VPC and can reach RDS). The migration
# bundle is uploaded to S3, then the jumpbox downloads it over SSM.
#
#   Actions -> Migrate -> Run workflow -> pick upgrade/downgrade (+ optional revision)
on:
  workflow_dispatch:
    inputs:
      action:
        description: Migration direction
        type: choice
        options:
          - upgrade
          - downgrade
        default: upgrade
      revision:
        description: Revision (blank = head for upgrade, -1 for downgrade)
        type: string
        required: false
        default: ""

concurrency:
  group: migrate-prod
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  ARTIFACTS_BUCKET: get1agent-terraform-state-ap-south-1
  ARTIFACTS_PREFIX: migrations
  JUMPBOX_TAG: get1agent-prod-jumpbox
  NAME_PREFIX: get1agent-prod

jobs:
  migrate:
    name: Run migration on jumpbox
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve revision
        id: rev
        run: |
          action='${{ inputs.action }}'
          revision='${{ inputs.revision }}'
          if [ -z "$revision" ]; then
            if [ "$action" = "downgrade" ]; then revision='-1'; else revision='head'; fi
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "Will run: $action $revision"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Package migration bundle
        run: |
          tar czf migrations.tgz \
            --exclude='.venv' --exclude='__pycache__' \
            --exclude='._*' --exclude='.DS_Store' \
            backend/migrations backend/services/shared infra/scripts/migrate-remote.sh
          ls -lh migrations.tgz

      - name: Upload bundle
        run: |
          aws s3 cp migrations.tgz \
            "s3://$ARTIFACTS_BUCKET/$ARTIFACTS_PREFIX/${{ github.run_id }}.tgz"

      - name: Find running jumpbox
        id: jumpbox
        run: |
          instance_id="$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=$JUMPBOX_TAG" \
                      "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' \
            --output text | head -1)"
          if [ -z "$instance_id" ]; then
            echo "No running jumpbox tagged $JUMPBOX_TAG" >&2
            exit 1
          fi
          echo "id=$instance_id" >> "$GITHUB_OUTPUT"
          echo "Jumpbox: $instance_id"

      - name: Send migration command
        id: send
        env:
          BUNDLE_URI: s3://${{ env.ARTIFACTS_BUCKET }}/${{ env.ARTIFACTS_PREFIX }}/${{ github.run_id }}.tgz
          ACTION: ${{ inputs.action }}
          REVISION: ${{ steps.rev.outputs.revision }}
        run: |
          cmd='set -euo pipefail; WORK=/tmp/get1agent-migrate; rm -rf "$WORK"; mkdir -p "$WORK"; cd "$WORK"; aws s3 cp "'"$BUNDLE_URI"'" bundle.tgz; tar xzf bundle.tgz; bash infra/scripts/migrate-remote.sh "'"$NAME_PREFIX"'" "'"$ACTION"'" "'"$REVISION"'"'
          python3 -c 'import json, sys; print(json.dumps({"commands": [sys.argv[1]]}))' "$cmd" > params.json
          command_id="$(aws ssm send-command \
            --instance-ids "${{ steps.jumpbox.outputs.id }}" \
            --document-name AWS-RunShellScript \
            --comment "get1agent migrate ${{ inputs.action }} ${{ steps.rev.outputs.revision }}" \
            --parameters file://params.json \
            --query 'Command.CommandId' --output text)"
          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"
          echo "Sent SSM command $command_id"

      - name: Wait for migration result
        if: always() && steps.send.outputs.command_id != ''
        run: |
          instance_id="${{ steps.jumpbox.outputs.id }}"
          command_id="${{ steps.send.outputs.command_id }}"
          status="Pending"
          for _ in $(seq 1 90); do
            status="$(aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "$instance_id" \
              --query Status --output text 2>/dev/null || echo Pending)"
            case "$status" in
              Success | Failed | Cancelled | TimedOut) break ;;
            esac
            sleep 10
          done
          echo "--- stdout ---"
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$instance_id" \
            --query StandardOutputContent --output text 2>/dev/null || true
          echo "--- stderr ---"
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$instance_id" \
            --query StandardErrorContent --output text 2>/dev/null || true
          if [ "$status" != "Success" ]; then
            echo "Migration ended with status: $status" >&2
            exit 1
          fi
