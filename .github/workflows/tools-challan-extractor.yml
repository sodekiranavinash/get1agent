name: Tool — challan-extractor

on:
  pull_request:
    paths:
      - "tools/challan-extractor/**"
      - ".github/workflows/tools-challan-extractor.yml"
      - ".github/workflows/deploy-tool-lambda.yml"
  push:
    branches: [main]
    paths:
      - "tools/challan-extractor/**"
      - ".github/workflows/tools-challan-extractor.yml"
      - ".github/workflows/deploy-tool-lambda.yml"
  workflow_dispatch:

concurrency:
  group: tool-challan-extractor
  cancel-in-progress: true

jobs:
  deploy:
    uses: ./.github/workflows/deploy-tool-lambda.yml
    with:
      tool_dir: tools/challan-extractor
      function_name: get1agent-dev-challan-extractor
      deploy: ${{ github.event_name != 'pull_request' }}
    secrets: inherit
