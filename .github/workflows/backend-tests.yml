name: Backend tests

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  workflow_dispatch:

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration:
    name: Integration tests (moto, no Docker)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Run integration tests
        run: make test

  unit:
    name: Unit tests (per lambda)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run unit tests
        run: make test-unit

  ai-assistant:
    # Its own job because AI Assistant is not a `backend/services/*` lambda: it lives
    # in `backend/ai-assistant/` with its own lockfile, so the per-lambda loop in
    # `make test-unit` never reached it. That is exactly how its suite went un-run —
    # including the tests pinning the gateway-claims identity rule. Keeping it a
    # named job makes a regression here impossible to miss in the checks list.
    name: AI Assistant tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Run AI Assistant tests
        run: make test-ai-assistant
