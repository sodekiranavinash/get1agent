name: Deploy frontend

on:
  push:
    branches: [main]
    paths:
      - frontend/**
      - .github/workflows/deploy-frontend.yml
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  SITE_BUCKET: www.get1agent.com

jobs:
  deploy:
    name: Build and sync to S3
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure website bucket exists
        run: |
          if ! aws s3api head-bucket --bucket "$SITE_BUCKET"; then
            echo "Bucket $SITE_BUCKET does not exist. Run the Infra workflow first so Terraform can create it."
            exit 1
          fi
          expected="www.get1agent.com"
          if [[ "$SITE_BUCKET" != "$expected" ]]; then
            echo "Bucket name must be $expected so Cloudflare Host header matches the S3 website bucket."
            exit 1
          fi

      - name: Sync hashed assets
        run: |
          aws s3 sync frontend/dist "s3://$SITE_BUCKET" \
            --delete \
            --exclude "index.html" \
            --cache-control "public,max-age=31536000,immutable"

      - name: Upload HTML entrypoints
        run: |
          aws s3 cp frontend/dist/index.html "s3://$SITE_BUCKET/index.html" \
            --content-type "text/html" \
            --cache-control "no-cache"
