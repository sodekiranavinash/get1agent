name: Infra

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply bootstrap (state bucket) then envs/dev Lambda resources
        type: boolean
        default: true

concurrency:
  group: infra-dev
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  TF_IN_AUTOMATION: "true"
  TF_STATE_BUCKET: get1agent-terraform-state-ap-south-1

jobs:
  terraform:
    name: Terraform (bootstrap + dev)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Terraform version
        id: tfver
        run: echo "version=$(tr -d '[:space:]' < infra/terraform/.terraform-version)" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ steps.tfver.outputs.version }}
          terraform_wrapper: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tools/challan-extractor/go.mod
          cache-dependency-path: tools/challan-extractor/go.sum

      - name: Terraform fmt
        run: terraform fmt -check -recursive -diff infra/terraform

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Initial CreateFunction needs a zip; later zip updates are the Tools workflow.
      - name: Package challan-extractor zip
        run: make package
        working-directory: tools/challan-extractor

      - name: Verify Lambda zip
        run: |
          test -s tools/challan-extractor/dist/function.zip
          unzip -l tools/challan-extractor/dist/function.zip | grep bootstrap

      - name: Decide plan vs apply
        id: mode
        run: |
          if [[ "${{ inputs.apply }}" == "true" ]]; then
            echo "apply=true" >> "$GITHUB_OUTPUT"
            echo "mode=apply" >> "$GITHUB_OUTPUT"
          else
            echo "apply=false" >> "$GITHUB_OUTPUT"
            echo "mode=plan" >> "$GITHUB_OUTPUT"
          fi

      - name: Bootstrap (S3 Terraform state)
        run: infra/aws/run-terraform.sh bootstrap "${{ steps.mode.outputs.mode }}"

      - name: Dev (challan-extractor Lambda)
        run: infra/aws/run-terraform.sh dev "${{ steps.mode.outputs.mode }}"

      - name: Upload Terraform plans
        if: steps.mode.outputs.apply != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plans
          if-no-files-found: ignore
          path: |
            infra/terraform/bootstrap/tfplan
            infra/terraform/envs/dev/tfplan

