name: Infra

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply bootstrap, web, prod (Lambda + optional data plane EC2/RDS)
        type: boolean
        default: true

concurrency:
  group: infra-prod
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "true"
  TF_STATE_BUCKET: get1agent-terraform-state-us-east-1

jobs:
  terraform:
    name: Terraform (bootstrap + web + prod)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Terraform version
        id: tfver
        run: echo "version=$(tr -d '[:space:]' < infra/terraform/.terraform-version)" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ steps.tfver.outputs.version }}
          terraform_wrapper: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tools/challan-extractor/go.mod
          cache-dependency-path: tools/challan-extractor/go.sum

      - name: Terraform fmt
        run: terraform fmt -check -recursive -diff infra/terraform

      - name: Terraform validate
        working-directory: infra/terraform/envs/prod
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Write prod terraform.tfvars
        run: |
          cat > infra/terraform/envs/prod/terraform.tfvars <<'EOF'
          aws_region               = "us-east-1"
          package_path             = "../../../../tools/challan-extractor/dist/function.zip"
          enable_data_plane        = true
          enable_api_custom_domain = true
          EOF

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Package challan-extractor zip
        run: make package
        working-directory: tools/challan-extractor

      - name: Package backend health-check zip
        run: make package
        working-directory: backend/health-check

      - name: Verify Lambda zips
        run: |
          test -s tools/challan-extractor/dist/function.zip
          unzip -l tools/challan-extractor/dist/function.zip | grep bootstrap
          test -s backend/health-check/dist/function.zip
          unzip -l backend/health-check/dist/function.zip | grep index.js

      - name: Decide plan vs apply
        id: mode
        run: |
          if [[ "${{ inputs.apply }}" == "true" ]]; then
            echo "mode=apply" >> "$GITHUB_OUTPUT"
          else
            echo "mode=plan" >> "$GITHUB_OUTPUT"
          fi

      - name: Bootstrap (S3 Terraform state)
        run: bash infra/aws/run-terraform.sh bootstrap "${{ steps.mode.outputs.mode }}"

      - name: Web (S3 website)
        run: bash infra/aws/run-terraform.sh web "${{ steps.mode.outputs.mode }}"

      - name: Prod (Lambda + data plane)
        run: bash infra/aws/run-terraform.sh prod "${{ steps.mode.outputs.mode }}"

      - name: Print outputs
        if: inputs.apply == true
        working-directory: infra/terraform/envs/prod
        run: |
          terraform init -input=false -no-color
          API_URL="$(terraform output -raw api_url)"
          echo "## API Gateway" >> "$GITHUB_STEP_SUMMARY"
          echo "- API URL: ${API_URL}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Health: ${API_URL}health" >> "$GITHUB_STEP_SUMMARY"
          echo "- DB health: ${API_URL}health/db" >> "$GITHUB_STEP_SUMMARY"
          echo "- Auth0 audience: $(terraform output -raw auth0_audience)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Data plane (jumpbox + RDS)" >> "$GITHUB_STEP_SUMMARY"
          echo "- DB tunnel: \`bash infra/aws/db-tunnel.sh\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- API CNAME target: $(terraform output -raw api_gateway_cname_target)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Terraform plans
        if: inputs.apply != true
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plans
          if-no-files-found: ignore
          path: |
            infra/terraform/bootstrap/tfplan
            infra/terraform/envs/web/tfplan
            infra/terraform/envs/prod/tfplan
