name: Infra

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply bootstrap, web, dev (Lambda + optional data plane EC2/RDS)
        type: boolean
        default: true

concurrency:
  group: infra-dev
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "true"
  TF_STATE_BUCKET: get1agent-terraform-state-us-east-1

jobs:
  terraform:
    name: Terraform (bootstrap + web + dev)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Terraform version
        id: tfver
        run: echo "version=$(tr -d '[:space:]' < infra/terraform/.terraform-version)" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ steps.tfver.outputs.version }}
          terraform_wrapper: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tools/challan-extractor/go.mod
          cache-dependency-path: tools/challan-extractor/go.sum

      - name: Terraform fmt
        run: terraform fmt -check -recursive -diff infra/terraform

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Write dev terraform.tfvars
        env:
          SSH_CIDR: ${{ secrets.DATA_PLANE_SSH_CIDR }}
          API_CIDR: ${{ secrets.DATA_PLANE_API_CIDR }}
        run: |
          normalize_cidr() {
            local value="$1"
            value="$(echo "$value" | tr -d '[:space:]')"
            if [[ -z "$value" ]]; then
              return 1
            fi
            if [[ "$value" != */* ]]; then
              value="${value}/32"
            fi
            if ! python3 -c "import ipaddress; ipaddress.ip_network('$value', strict=False)" 2>/dev/null; then
              echo "Invalid CIDR: $value (use YOUR.PUBLIC.IP/32)" >&2
              exit 1
            fi
            echo "$value"
          }

          TFVARS=infra/terraform/envs/dev/terraform.tfvars
          cat > "$TFVARS" <<EOF
          aws_region   = "us-east-1"
          package_path = "../../../../tools/challan-extractor/dist/function.zip"
          EOF
          if [[ -n "$SSH_CIDR" ]]; then
            SSH_CIDR_NORM="$(normalize_cidr "$SSH_CIDR")"
            cat >> "$TFVARS" <<EOF
          enable_data_plane          = true
          data_plane_ssh_cidr_blocks = ["$SSH_CIDR_NORM"]
          EOF
            if [[ -n "$API_CIDR" ]]; then
              API_CIDR_NORM="$(normalize_cidr "$API_CIDR")"
              echo "data_plane_api_cidr_blocks = [\"$API_CIDR_NORM\"]" >> "$TFVARS"
            fi
          else
            cat >> "$TFVARS" <<'EOF'
          enable_data_plane = false
          EOF
            echo "::notice::DATA_PLANE_SSH_CIDR secret not set — skipping EC2/RDS. See infra/DEPLOY.md"
          fi

      - name: Package challan-extractor zip
        run: make package
        working-directory: tools/challan-extractor

      - name: Verify Lambda zip
        run: |
          test -s tools/challan-extractor/dist/function.zip
          unzip -l tools/challan-extractor/dist/function.zip | grep bootstrap

      - name: Decide plan vs apply
        id: mode
        run: |
          if [[ "${{ inputs.apply }}" == "true" ]]; then
            echo "mode=apply" >> "$GITHUB_OUTPUT"
          else
            echo "mode=plan" >> "$GITHUB_OUTPUT"
          fi

      - name: Bootstrap (S3 Terraform state)
        run: bash infra/aws/run-terraform.sh bootstrap "${{ steps.mode.outputs.mode }}"

      - name: Web (S3 website)
        run: bash infra/aws/run-terraform.sh web "${{ steps.mode.outputs.mode }}"

      - name: Dev (Lambda + data plane)
        run: bash infra/aws/run-terraform.sh dev "${{ steps.mode.outputs.mode }}"

      - name: Print data plane outputs
        if: inputs.apply == true
        env:
          SSH_CIDR: ${{ secrets.DATA_PLANE_SSH_CIDR }}
        working-directory: infra/terraform/envs/dev
        run: |
          if [[ -z "$SSH_CIDR" ]]; then
            echo "Data plane skipped (set DATA_PLANE_SSH_CIDR secret to enable)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          terraform init -input=false -no-color
          echo "## Data plane" >> "$GITHUB_STEP_SUMMARY"
          echo "- API URL: $(terraform output -raw api_base_url)" >> "$GITHUB_STEP_SUMMARY"
          echo "- App IP (DBeaver SSH): $(terraform output -raw app_public_ip)" >> "$GITHUB_STEP_SUMMARY"
          echo "- RDS host (DBeaver main tab): $(terraform output -raw postgres_endpoint)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Next: run **Deploy control_plane** workflow, then connect DBeaver (infra/DEPLOY.md)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Terraform plans
        if: inputs.apply != true
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plans
          if-no-files-found: ignore
          path: |
            infra/terraform/bootstrap/tfplan
            infra/terraform/envs/web/tfplan
            infra/terraform/envs/dev/tfplan
