name: Infra

on:
  workflow_dispatch:
    inputs:
      web:
        description: Web - S3 static site bucket (www.get1agent.com)
        type: boolean
        default: false
      api_gateway:
        description: API Gateway - HTTP API + Auth0 JWT + custom domain
        type: boolean
        default: false
      lambdas:
        description: Lambdas - DynamoDB + S3 Vectors + backend Lambdas
        type: boolean
        default: false
      cloudflare:
        description: Cloudflare - DNS, zone settings, rules and Workers for get1agent.com
        type: boolean
        default: false

concurrency:
  group: infra-prod
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  TF_IN_AUTOMATION: "true"
  TF_STATE_BUCKET: get1agent-terraform-state-ap-south-1

jobs:
  infra:
    name: Infra deploy
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require at least one component
        if: >-
          inputs.web == false &&
          inputs.api_gateway == false &&
          inputs.lambdas == false &&
          inputs.cloudflare == false
        run: |
          echo "Select at least one component." >&2
          exit 1

      - name: Read Terraform version
        id: tfver
        run: echo "version=$(tr -d '[:space:]' < infra/terraform/.terraform-version)" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ steps.tfver.outputs.version }}
          terraform_wrapper: false

      - name: Setup uv
        if: inputs.api_gateway || inputs.lambdas
        uses: astral-sh/setup-uv@v5

      - name: Run integration tests
        if: inputs.api_gateway || inputs.lambdas
        run: make test

      - name: Run unit tests
        if: inputs.api_gateway || inputs.lambdas
        run: make test-unit

      - name: Terraform fmt
        run: terraform fmt -check -recursive infra/terraform

      - name: Write prod terraform.tfvars
        if: inputs.api_gateway || inputs.lambdas
        run: bash infra/aws/write-prod-tfvars.sh

      - name: Set up QEMU
        if: inputs.api_gateway || inputs.lambdas
        uses: docker/setup-qemu-action@v3

      - name: Build backend data layer
        if: inputs.api_gateway || inputs.lambdas
        run: bash infra/aws/build-backend-layers.sh

      - name: Package user-api zip
        if: inputs.api_gateway || inputs.lambdas
        run: make package
        working-directory: backend/services/apis/user-api

      - name: Package knowledge-mcp zip
        if: inputs.api_gateway || inputs.lambdas
        run: make package
        working-directory: backend/services/mcp/knowledge-mcp

      - name: Package admin-console zip
        if: inputs.api_gateway || inputs.lambdas
        run: make package
        working-directory: backend/services/admin/admin-console

      - name: Package code-interpreter zip
        if: inputs.api_gateway || inputs.lambdas
        run: make package
        working-directory: backend/services/mcp/code-interpreter

      - name: Package http-fetch zip
        if: inputs.api_gateway || inputs.lambdas
        run: make package
        working-directory: backend/services/mcp/http-fetch

      - name: Package storage zip
        if: inputs.api_gateway || inputs.lambdas
        run: make package
        working-directory: backend/services/mcp/storage

      - name: Package custom-tools zip
        if: inputs.api_gateway || inputs.lambdas
        run: make package
        working-directory: backend/services/mcp/custom-tools

      - name: Package mcp-connections zip
        if: inputs.api_gateway || inputs.lambdas
        run: make package
        working-directory: backend/services/mcp/mcp-connections

      - name: Package agent-run zip
        if: inputs.api_gateway || inputs.lambdas
        run: make package
        working-directory: backend/services/agent-run

      - name: Package ingestion-dispatcher zip
        if: inputs.api_gateway || inputs.lambdas
        run: make package
        working-directory: backend/services/ingestion/ingestion-dispatcher

      - name: Package ingestion-extract zip
        if: inputs.api_gateway || inputs.lambdas
        run: make package
        working-directory: backend/services/ingestion/ingestion-extract

      - name: Package ingestion-embed zip
        if: inputs.api_gateway || inputs.lambdas
        run: make package
        working-directory: backend/services/ingestion/ingestion-embed

      - name: Package ingestion-index zip
        if: inputs.api_gateway || inputs.lambdas
        run: make package
        working-directory: backend/services/ingestion/ingestion-index

      - name: Package ingestion-graph-extract zip
        if: inputs.api_gateway || inputs.lambdas
        run: make package
        working-directory: backend/services/ingestion/ingestion-graph-extract

      - name: Package ingestion-mark-failed zip
        if: inputs.api_gateway || inputs.lambdas
        run: make package
        working-directory: backend/services/ingestion/ingestion-mark-failed

      - name: Package ingestion-watchdog zip
        if: inputs.api_gateway || inputs.lambdas
        run: make package
        working-directory: backend/services/ingestion/ingestion-watchdog

      - name: Package scheduler zip
        if: inputs.api_gateway || inputs.lambdas
        run: make package
        working-directory: backend/services/scheduler

      - name: Package browser zip
        if: inputs.api_gateway || inputs.lambdas
        run: make package
        working-directory: backend/services/mcp/browser

      # AI Assistant is a Lambda under `backend/ai-assistant/`, not
      # `backend/services/*`, so it needs its own packaging step — the other 17 are
      # all services. `apply-prod.sh` requires this zip whenever lambdas are
      # targeted, and without this step the apply fails before touching anything.
      - name: Package ai-assistant zip
        if: inputs.api_gateway || inputs.lambdas
        run: make package
        working-directory: backend/ai-assistant

      - name: Verify Lambda zips
        if: inputs.api_gateway || inputs.lambdas
        run: |
          test -s backend/services/apis/user-api/dist/function.zip
          unzip -l backend/services/apis/user-api/dist/function.zip | grep handler.py
          test -s backend/services/mcp/knowledge-mcp/dist/function.zip
          unzip -l backend/services/mcp/knowledge-mcp/dist/function.zip | grep handler.py
          test -s backend/services/ingestion/ingestion-dispatcher/dist/function.zip
          unzip -l backend/services/ingestion/ingestion-dispatcher/dist/function.zip | grep handler.py
          test -s backend/services/ingestion/ingestion-extract/dist/function.zip
          unzip -l backend/services/ingestion/ingestion-extract/dist/function.zip | grep handler.py
          test -s backend/services/ingestion/ingestion-embed/dist/function.zip
          unzip -l backend/services/ingestion/ingestion-embed/dist/function.zip | grep handler.py
          test -s backend/services/ingestion/ingestion-index/dist/function.zip
          unzip -l backend/services/ingestion/ingestion-index/dist/function.zip | grep handler.py
          test -s backend/services/ingestion/ingestion-graph-extract/dist/function.zip
          unzip -l backend/services/ingestion/ingestion-graph-extract/dist/function.zip | grep handler.py
          test -s backend/services/ingestion/ingestion-mark-failed/dist/function.zip
          unzip -l backend/services/ingestion/ingestion-mark-failed/dist/function.zip | grep handler.py
          test -s backend/services/ingestion/ingestion-watchdog/dist/function.zip
          unzip -l backend/services/ingestion/ingestion-watchdog/dist/function.zip | grep handler.py
          test -s backend/services/admin/admin-console/dist/function.zip
          unzip -l backend/services/admin/admin-console/dist/function.zip | grep handler.py
          test -s backend/services/mcp/code-interpreter/dist/function.zip
          unzip -l backend/services/mcp/code-interpreter/dist/function.zip | grep handler.py
          test -s backend/services/mcp/http-fetch/dist/function.zip
          unzip -l backend/services/mcp/http-fetch/dist/function.zip | grep handler.py
          test -s backend/services/mcp/storage/dist/function.zip
          unzip -l backend/services/mcp/storage/dist/function.zip | grep handler.py
          test -s backend/services/mcp/custom-tools/dist/function.zip
          unzip -l backend/services/mcp/custom-tools/dist/function.zip | grep handler.py
          test -s backend/services/mcp/mcp-connections/dist/function.zip
          unzip -l backend/services/mcp/mcp-connections/dist/function.zip | grep handler.py
          test -s backend/services/agent-run/dist/function.zip
          unzip -l backend/services/agent-run/dist/function.zip | grep index.mjs
          test -s backend/services/agent-run/dist/microvm.zip
          unzip -l backend/services/agent-run/dist/microvm.zip | grep Dockerfile
          unzip -l backend/services/agent-run/dist/microvm.zip | grep 'app.mjs'
          test -s backend/services/scheduler/dist/function.zip
          unzip -l backend/services/scheduler/dist/function.zip | grep handler.py
          test -s backend/services/mcp/browser/dist/function.zip
          unzip -l backend/services/mcp/browser/dist/function.zip | grep handler.py
          test -s backend/ai-assistant/dist/function.zip
          unzip -l backend/ai-assistant/dist/function.zip | grep handler.py

      - name: Terraform validate
        if: inputs.api_gateway || inputs.lambdas
        working-directory: infra/terraform/envs/prod
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Configure AWS credentials
        if: inputs.web || inputs.api_gateway || inputs.lambdas || inputs.cloudflare
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Bootstrap state bucket
        if: inputs.web || inputs.api_gateway || inputs.lambdas || inputs.cloudflare
        run: bash infra/aws/run-terraform.sh bootstrap apply

      - name: Web
        if: inputs.web
        run: bash infra/aws/run-terraform.sh web apply

      - name: Cloudflare
        if: inputs.cloudflare
        env:
          # Legacy Global API Key auth (the same credential .env uses locally).
          # A scoped CLOUDFLARE_API_TOKEN would also work — providers.tf accepts
          # either — but with the key there is nothing new to create.
          TF_VAR_cloudflare_api_key: ${{ secrets.CLOUDFLARE_API_KEY }}
          TF_VAR_cloudflare_email: ${{ secrets.CLOUDFLARE_EMAIL }}
          # HSTS must stay off unless deliberately enabled; see infra/CLOUDFLARE.md.
          ENABLE_HSTS: ${{ vars.CLOUDFLARE_ENABLE_HSTS }}
        run: |
          bash infra/aws/write-cloudflare-tfvars.sh
          bash infra/aws/run-terraform.sh cloudflare apply

      - name: Prod
        if: inputs.api_gateway || inputs.lambdas
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          APPLY_API_GATEWAY: ${{ inputs.api_gateway }}
          APPLY_BACKEND_LAMBDAS: ${{ inputs.lambdas }}
          TF_VAR_trace_link_secret: ${{ secrets.TRACE_LINK_SECRET }}
          # GitHub forbids secret names starting with GITHUB_, so the repo
          # secrets are MCP_GITHUB_*; they feed the matching Terraform vars.
          TF_VAR_MCP_GITHUB_CLIENT_ID: ${{ secrets.MCP_GITHUB_CLIENT_ID }}
          TF_VAR_MCP_GITHUB_CLIENT_SECRET: ${{ secrets.MCP_GITHUB_CLIENT_SECRET }}
          # Auth0 M2M ("platform service"): user-api + scheduler mint a
          # client-credentials token to run agents server-side (schedules, evals).
          TF_VAR_agent_service_client_id: ${{ secrets.AGENT_SERVICE_CLIENT_ID }}
          TF_VAR_agent_service_client_secret: ${{ secrets.AGENT_SERVICE_CLIENT_SECRET }}
          # AgentCore Browser domain allowlist (comma-separated suffixes). Empty
          # denies every domain. Set the repo/environment variable to enable it.
          BROWSER_ALLOWED_DOMAINS: ${{ vars.BROWSER_ALLOWED_DOMAINS }}
          # Auth0 Management API M2M (scope delete:users): erases the Auth0
          # identity on account deletion. Optional; blank = manual step.
          TF_VAR_auth_mgmt_client_id: ${{ secrets.AUTH_MGMT_CLIENT_ID }}
          TF_VAR_auth_mgmt_client_secret: ${{ secrets.AUTH_MGMT_CLIENT_SECRET }}
          # Optional Redis (shared limiter + caches). Stored as an SSM
          # SecureString by Terraform and read by the Lambdas on first use
          # (REDIS_URL_SSM_PARAM). Unset/empty leaves Redis off and every caller
          # on its DynamoDB / S3 Vectors fallback, so this never blocks a deploy.
          TF_VAR_redis_url: ${{ secrets.REDIS_URL }}
        run: bash infra/aws/apply-prod.sh

      - name: Agent runtime (build + push image, deploy)
        if: inputs.lambdas
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          IMAGE_TAG: ${{ github.sha }}
          TF_VAR_trace_link_secret: ${{ secrets.TRACE_LINK_SECRET }}
          TF_VAR_MCP_GITHUB_CLIENT_ID: ${{ secrets.MCP_GITHUB_CLIENT_ID }}
          TF_VAR_MCP_GITHUB_CLIENT_SECRET: ${{ secrets.MCP_GITHUB_CLIENT_SECRET }}
          # The runtime only needs the M2M client *id* (SERVICE_AUTH_CLIENT_ID) to
          # know which `sub` to trust; it never receives the secret.
          TF_VAR_agent_service_client_id: ${{ secrets.AGENT_SERVICE_CLIENT_ID }}
        run: bash infra/aws/deploy-agent-runtime.sh

      - name: Print prod outputs
        if: inputs.api_gateway || inputs.lambdas
        working-directory: infra/terraform/envs/prod
        run: |
          terraform init -input=false -no-color
          if terraform output -raw api_url >/dev/null 2>&1; then
            API_URL="$(terraform output -raw api_url)"
            echo "## API Gateway" >> "$GITHUB_STEP_SUMMARY"
            echo "- API URL: ${API_URL}" >> "$GITHUB_STEP_SUMMARY"
            echo "- Auth0 audience: $(terraform output -raw auth0_audience)" >> "$GITHUB_STEP_SUMMARY"
          fi
          if terraform output -raw dynamodb_table_name >/dev/null 2>&1; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "## Data" >> "$GITHUB_STEP_SUMMARY"
            echo "- DynamoDB: $(terraform output -raw dynamodb_table_name)" >> "$GITHUB_STEP_SUMMARY"
            echo "- S3 Vectors: $(terraform output -raw vector_bucket_name)" >> "$GITHUB_STEP_SUMMARY"
            echo "- API CNAME: $(terraform output -raw api_gateway_cname_target 2>/dev/null || echo n/a)" >> "$GITHUB_STEP_SUMMARY"
          fi
