name: Infra

on:
  workflow_dispatch:
    inputs:
      web:
        description: Web - S3 static site bucket (www.get1agent.com)
        type: boolean
        default: false
      api_gateway:
        description: API Gateway - HTTP API + Auth0 JWT + custom domain
        type: boolean
        default: false
      lambdas:
        description: Lambdas - DynamoDB + S3 Vectors + backend Lambdas
        type: boolean
        default: false

concurrency:
  group: infra-prod
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  TF_IN_AUTOMATION: "true"
  TF_STATE_BUCKET: get1agent-terraform-state-ap-south-1

jobs:
  infra:
    name: Infra deploy
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require at least one component
        if: >-
          inputs.web == false &&
          inputs.api_gateway == false &&
          inputs.lambdas == false
        run: |
          echo "Select at least one component." >&2
          exit 1

      - name: Read Terraform version
        id: tfver
        run: echo "version=$(tr -d '[:space:]' < infra/terraform/.terraform-version)" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ steps.tfver.outputs.version }}
          terraform_wrapper: false

      - name: Setup uv
        if: inputs.api_gateway || inputs.lambdas
        uses: astral-sh/setup-uv@v5

      - name: Run integration tests
        if: inputs.api_gateway || inputs.lambdas
        run: make test

      - name: Run unit tests
        if: inputs.api_gateway || inputs.lambdas
        run: make test-unit

      - name: Terraform fmt
        run: terraform fmt -check -recursive infra/terraform

      - name: Write prod terraform.tfvars
        if: inputs.api_gateway || inputs.lambdas
        run: bash infra/aws/write-prod-tfvars.sh

      - name: Set up QEMU
        if: inputs.api_gateway || inputs.lambdas
        uses: docker/setup-qemu-action@v3

      - name: Build backend data layer
        if: inputs.api_gateway || inputs.lambdas
        run: bash infra/aws/build-backend-layers.sh

      - name: Package user-api zip
        if: inputs.api_gateway || inputs.lambdas
        run: make package
        working-directory: backend/services/user-api

      - name: Package knowledge-mcp zip
        if: inputs.api_gateway || inputs.lambdas
        run: make package
        working-directory: backend/services/knowledge-mcp

      - name: Package mcp-tester zip
        if: inputs.api_gateway || inputs.lambdas
        run: make package
        working-directory: backend/services/mcp-tester

      - name: Package code-interpreter zip
        if: inputs.api_gateway || inputs.lambdas
        run: make package
        working-directory: backend/services/code-interpreter

      - name: Package web-search zip
        if: inputs.api_gateway || inputs.lambdas
        run: make package
        working-directory: backend/services/web-search

      - name: Package mcp-connections zip
        if: inputs.api_gateway || inputs.lambdas
        run: make package
        working-directory: backend/services/mcp-connections

      - name: Package agent-run zip
        if: inputs.api_gateway || inputs.lambdas
        run: make package
        working-directory: backend/services/agent-run

      - name: Package ingestion-dispatcher zip
        if: inputs.api_gateway || inputs.lambdas
        run: make package
        working-directory: backend/services/ingestion-dispatcher

      - name: Package ingestion-extract zip
        if: inputs.api_gateway || inputs.lambdas
        run: make package
        working-directory: backend/services/ingestion-extract

      - name: Package ingestion-embed zip
        if: inputs.api_gateway || inputs.lambdas
        run: make package
        working-directory: backend/services/ingestion-embed

      - name: Package ingestion-index zip
        if: inputs.api_gateway || inputs.lambdas
        run: make package
        working-directory: backend/services/ingestion-index

      - name: Package ingestion-mark-failed zip
        if: inputs.api_gateway || inputs.lambdas
        run: make package
        working-directory: backend/services/ingestion-mark-failed

      - name: Package ingestion-watchdog zip
        if: inputs.api_gateway || inputs.lambdas
        run: make package
        working-directory: backend/services/ingestion-watchdog

      - name: Verify Lambda zips
        if: inputs.api_gateway || inputs.lambdas
        run: |
          test -s backend/services/dependency-layers/base/dist/layer.zip
          unzip -l backend/services/dependency-layers/base/dist/layer.zip | grep 'python/tzdata'
          test -s backend/services/dependency-layers/genai/dist/layer.zip
          unzip -l backend/services/dependency-layers/genai/dist/layer.zip | grep 'python/awslabs'
          test -s backend/services/user-api/dist/function.zip
          unzip -l backend/services/user-api/dist/function.zip | grep handler.py
          test -s backend/services/knowledge-mcp/dist/function.zip
          unzip -l backend/services/knowledge-mcp/dist/function.zip | grep handler.py
          test -s backend/services/ingestion-dispatcher/dist/function.zip
          unzip -l backend/services/ingestion-dispatcher/dist/function.zip | grep handler.py
          test -s backend/services/ingestion-extract/dist/function.zip
          unzip -l backend/services/ingestion-extract/dist/function.zip | grep handler.py
          test -s backend/services/ingestion-embed/dist/function.zip
          unzip -l backend/services/ingestion-embed/dist/function.zip | grep handler.py
          test -s backend/services/ingestion-index/dist/function.zip
          unzip -l backend/services/ingestion-index/dist/function.zip | grep handler.py
          test -s backend/services/ingestion-mark-failed/dist/function.zip
          unzip -l backend/services/ingestion-mark-failed/dist/function.zip | grep handler.py
          test -s backend/services/ingestion-watchdog/dist/function.zip
          unzip -l backend/services/ingestion-watchdog/dist/function.zip | grep handler.py
          test -s backend/services/mcp-tester/dist/function.zip
          unzip -l backend/services/mcp-tester/dist/function.zip | grep handler.py
          test -s backend/services/code-interpreter/dist/function.zip
          unzip -l backend/services/code-interpreter/dist/function.zip | grep handler.py
          test -s backend/services/web-search/dist/function.zip
          unzip -l backend/services/web-search/dist/function.zip | grep handler.py
          test -s backend/services/mcp-connections/dist/function.zip
          unzip -l backend/services/mcp-connections/dist/function.zip | grep handler.py
          test -s backend/services/agent-run/dist/function.zip
          unzip -l backend/services/agent-run/dist/function.zip | grep index.mjs
          test -s backend/services/agent-run/dist/microvm.zip
          unzip -l backend/services/agent-run/dist/microvm.zip | grep Dockerfile
          unzip -l backend/services/agent-run/dist/microvm.zip | grep 'app.mjs'

      - name: Terraform validate
        if: inputs.api_gateway || inputs.lambdas
        working-directory: infra/terraform/envs/prod
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Configure AWS credentials
        if: inputs.web || inputs.api_gateway || inputs.lambdas
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Bootstrap state bucket
        if: inputs.web || inputs.api_gateway || inputs.lambdas
        run: bash infra/aws/run-terraform.sh bootstrap apply

      - name: Web
        if: inputs.web
        run: bash infra/aws/run-terraform.sh web apply

      - name: Prod
        if: inputs.api_gateway || inputs.lambdas
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          APPLY_API_GATEWAY: ${{ inputs.api_gateway }}
          APPLY_BACKEND_LAMBDAS: ${{ inputs.lambdas }}
          TF_VAR_exa_api_key: ${{ secrets.EXA_API_KEY }}
          TF_VAR_voyage_api_key: ${{ secrets.VOYAGE_API_KEY }}
          TF_VAR_opencode_api_key: ${{ secrets.OPENCODE_API_KEY }}
          # GitHub forbids secret names starting with GITHUB_, so the repo
          # secrets are MCP_GITHUB_*; they feed the GITHUB_MCP_* Terraform vars.
          TF_VAR_GITHUB_MCP_CLIENT_ID: ${{ secrets.MCP_GITHUB_CLIENT_ID }}
          TF_VAR_GITHUB_MCP_CLIENT_SECRET: ${{ secrets.MCP_GITHUB_CLIENT_SECRET }}
        run: bash infra/aws/apply-prod.sh

      - name: Agent runtime (build + push image, deploy)
        if: inputs.lambdas
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          IMAGE_TAG: ${{ github.sha }}
          TF_VAR_exa_api_key: ${{ secrets.EXA_API_KEY }}
          TF_VAR_voyage_api_key: ${{ secrets.VOYAGE_API_KEY }}
          TF_VAR_opencode_api_key: ${{ secrets.OPENCODE_API_KEY }}
          TF_VAR_GITHUB_MCP_CLIENT_ID: ${{ secrets.MCP_GITHUB_CLIENT_ID }}
          TF_VAR_GITHUB_MCP_CLIENT_SECRET: ${{ secrets.MCP_GITHUB_CLIENT_SECRET }}
        run: bash infra/aws/deploy-agent-runtime.sh

      - name: Print prod outputs
        if: inputs.api_gateway || inputs.lambdas
        working-directory: infra/terraform/envs/prod
        run: |
          terraform init -input=false -no-color
          if terraform output -raw api_url >/dev/null 2>&1; then
            API_URL="$(terraform output -raw api_url)"
            echo "## API Gateway" >> "$GITHUB_STEP_SUMMARY"
            echo "- API URL: ${API_URL}" >> "$GITHUB_STEP_SUMMARY"
            echo "- Auth0 audience: $(terraform output -raw auth0_audience)" >> "$GITHUB_STEP_SUMMARY"
          fi
          if terraform output -raw dynamodb_table_name >/dev/null 2>&1; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "## Data" >> "$GITHUB_STEP_SUMMARY"
            echo "- DynamoDB: $(terraform output -raw dynamodb_table_name)" >> "$GITHUB_STEP_SUMMARY"
            echo "- S3 Vectors: $(terraform output -raw vector_bucket_name)" >> "$GITHUB_STEP_SUMMARY"
            echo "- API CNAME: $(terraform output -raw api_gateway_cname_target 2>/dev/null || echo n/a)" >> "$GITHUB_STEP_SUMMARY"
          fi
