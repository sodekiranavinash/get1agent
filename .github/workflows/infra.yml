name: Infra

on:
  workflow_dispatch:
    inputs:
      web:
        description: Web - S3 static site bucket (www.get1agent.com)
        type: boolean
        default: false
      vpc:
        description: VPC - network, subnets, jumpbox
        type: boolean
        default: false
      rds:
        description: RDS - PostgreSQL
        type: boolean
        default: false
      api_gateway:
        description: API Gateway - HTTP API + Auth0 JWT + custom domain
        type: boolean
        default: false
      lambdas:
        description: Lambdas
        type: boolean
        default: false

concurrency:
  group: infra-prod
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "true"
  TF_STATE_BUCKET: get1agent-terraform-state-us-east-1

jobs:
  infra:
    name: Infra deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require at least one component
        if: >-
          inputs.web == false &&
          inputs.vpc == false &&
          inputs.rds == false &&
          inputs.api_gateway == false &&
          inputs.lambdas == false
        run: |
          echo "Select at least one component." >&2
          exit 1

      - name: Read Terraform version
        id: tfver
        run: echo "version=$(tr -d '[:space:]' < infra/terraform/.terraform-version)" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ steps.tfver.outputs.version }}
          terraform_wrapper: false

      - name: Setup Go
        if: inputs.vpc || inputs.rds || inputs.api_gateway || inputs.lambdas
        uses: actions/setup-go@v5
        with:
          go-version-file: tools/challan-extractor/go.mod
          cache-dependency-path: tools/challan-extractor/go.sum

      - name: Setup Node.js
        if: inputs.vpc || inputs.rds || inputs.api_gateway || inputs.lambdas
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Terraform fmt
        run: terraform fmt -check -recursive infra/terraform

      - name: Write prod terraform.tfvars
        if: inputs.vpc || inputs.rds || inputs.api_gateway || inputs.lambdas
        run: bash infra/aws/write-prod-tfvars.sh

      - name: Package challan-extractor zip
        if: inputs.vpc || inputs.rds || inputs.api_gateway || inputs.lambdas
        run: make package
        working-directory: tools/challan-extractor

      - name: Package backend health-check zip
        if: inputs.vpc || inputs.rds || inputs.api_gateway || inputs.lambdas
        run: make package
        working-directory: backend/health-check

      - name: Verify Lambda zips
        if: inputs.vpc || inputs.rds || inputs.api_gateway || inputs.lambdas
        run: |
          test -s tools/challan-extractor/dist/function.zip
          unzip -l tools/challan-extractor/dist/function.zip | grep bootstrap
          test -s backend/health-check/dist/function.zip
          unzip -l backend/health-check/dist/function.zip | grep index.js

      - name: Terraform validate
        if: inputs.vpc || inputs.rds || inputs.api_gateway || inputs.lambdas
        working-directory: infra/terraform/envs/prod
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Bootstrap state bucket
        run: bash infra/aws/run-terraform.sh bootstrap apply

      - name: Web
        if: inputs.web
        run: bash infra/aws/run-terraform.sh web apply

      - name: Prod
        if: inputs.vpc || inputs.rds || inputs.api_gateway || inputs.lambdas
        env:
          APPLY_NETWORK: ${{ inputs.vpc }}
          APPLY_RDS: ${{ inputs.rds }}
          APPLY_API_GATEWAY: ${{ inputs.api_gateway }}
          APPLY_BACKEND_LAMBDAS: ${{ inputs.lambdas }}
          APPLY_TOOL_LAMBDAS: ${{ inputs.lambdas }}
        run: bash infra/aws/apply-prod.sh

      - name: Print prod outputs
        if: inputs.vpc || inputs.rds || inputs.api_gateway || inputs.lambdas
        working-directory: infra/terraform/envs/prod
        run: |
          terraform init -input=false -no-color
          if terraform output -raw api_url >/dev/null 2>&1; then
            API_URL="$(terraform output -raw api_url)"
            echo "## API Gateway" >> "$GITHUB_STEP_SUMMARY"
            echo "- API URL: ${API_URL}" >> "$GITHUB_STEP_SUMMARY"
            echo "- Health: ${API_URL}health" >> "$GITHUB_STEP_SUMMARY"
            echo "- DB health: ${API_URL}health/db" >> "$GITHUB_STEP_SUMMARY"
            echo "- Auth0 audience: $(terraform output -raw auth0_audience)" >> "$GITHUB_STEP_SUMMARY"
          fi
          if terraform output -raw jumpbox_instance_id >/dev/null 2>&1; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "## Network / RDS" >> "$GITHUB_STEP_SUMMARY"
            echo "- Jumpbox: $(terraform output -raw jumpbox_instance_id) (stopped after apply)" >> "$GITHUB_STEP_SUMMARY"
            echo "- Local DB: bash infra/aws/db-access.sh" >> "$GITHUB_STEP_SUMMARY"
            echo "- API CNAME: $(terraform output -raw api_gateway_cname_target 2>/dev/null || echo n/a)" >> "$GITHUB_STEP_SUMMARY"
          fi
