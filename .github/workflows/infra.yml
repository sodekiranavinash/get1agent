name: Infra

on:
  push:
    branches: [main]
    paths:
      - frontend/**
  workflow_dispatch:
    inputs:
      apply:
        description: Apply (uncheck for plan only)
        type: boolean
        default: true
      bootstrap:
        description: Bootstrap - S3 state bucket
        type: boolean
        default: true
      web:
        description: Web - S3 website bucket
        type: boolean
        default: true
      frontend:
        description: Frontend - build and sync to S3
        type: boolean
        default: false
      prod:
        description: Prod - API Gateway, VPC/RDS, Lambdas
        type: boolean
        default: true

concurrency:
  group: infra-prod
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "true"
  TF_STATE_BUCKET: get1agent-terraform-state-us-east-1
  SITE_BUCKET: www.get1agent.com

jobs:
  infra:
    name: Infra deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require at least one component
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.bootstrap == false &&
          inputs.web == false &&
          inputs.frontend == false &&
          inputs.prod == false
        run: |
          echo "Select at least one component (Bootstrap, Web, Frontend, or Prod)." >&2
          exit 1

      - name: Read Terraform version
        if: >-
          (github.event_name == 'workflow_dispatch' && (inputs.bootstrap || inputs.web || inputs.prod)) ||
          github.event_name == 'push'
        id: tfver
        run: echo "version=$(tr -d '[:space:]' < infra/terraform/.terraform-version)" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        if: >-
          github.event_name == 'workflow_dispatch' && (inputs.bootstrap || inputs.web || inputs.prod)
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ steps.tfver.outputs.version }}
          terraform_wrapper: false

      - name: Setup Go
        if: github.event_name == 'workflow_dispatch' && inputs.prod
        uses: actions/setup-go@v5
        with:
          go-version-file: tools/challan-extractor/go.mod
          cache-dependency-path: tools/challan-extractor/go.sum

      - name: Setup Node.js
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && (inputs.frontend || inputs.prod))
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Terraform fmt
        if: github.event_name == 'workflow_dispatch' && (inputs.bootstrap || inputs.web || inputs.prod)
        run: terraform fmt -check -recursive infra/terraform

      - name: Write prod terraform.tfvars
        if: github.event_name == 'workflow_dispatch' && inputs.prod
        run: |
          cat > infra/terraform/envs/prod/terraform.tfvars <<'EOF'
          aws_region               = "us-east-1"
          package_path             = "../../../../tools/challan-extractor/dist/function.zip"
          enable_vpc_rds           = true
          enable_api_custom_domain = true
          EOF

      - name: Package challan-extractor zip
        if: github.event_name == 'workflow_dispatch' && inputs.prod
        run: make package
        working-directory: tools/challan-extractor

      - name: Package backend health-check zip
        if: github.event_name == 'workflow_dispatch' && inputs.prod
        run: make package
        working-directory: backend/health-check

      - name: Verify Lambda zips
        if: github.event_name == 'workflow_dispatch' && inputs.prod
        run: |
          test -s tools/challan-extractor/dist/function.zip
          unzip -l tools/challan-extractor/dist/function.zip | grep bootstrap
          test -s backend/health-check/dist/function.zip
          unzip -l backend/health-check/dist/function.zip | grep index.js

      - name: Terraform validate
        if: github.event_name == 'workflow_dispatch' && inputs.prod
        working-directory: infra/terraform/envs/prod
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Bootstrap
        if: github.event_name == 'workflow_dispatch' && inputs.bootstrap
        run: |
          if [[ "${{ inputs.apply }}" == "true" ]]; then
            bash infra/aws/run-terraform.sh bootstrap apply
          else
            bash infra/aws/run-terraform.sh bootstrap plan
          fi

      - name: Web
        if: github.event_name == 'workflow_dispatch' && inputs.web
        run: |
          if [[ "${{ inputs.apply }}" == "true" ]]; then
            bash infra/aws/run-terraform.sh web apply
          else
            bash infra/aws/run-terraform.sh web plan
          fi

      - name: Prod
        if: github.event_name == 'workflow_dispatch' && inputs.prod
        run: |
          if [[ "${{ inputs.apply }}" == "true" ]]; then
            bash infra/aws/run-terraform.sh prod apply
          else
            bash infra/aws/run-terraform.sh prod plan
          fi

      - name: Build frontend
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.frontend)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Deploy frontend to S3
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.frontend && inputs.apply)
        run: |
          if ! aws s3api head-bucket --bucket "$SITE_BUCKET"; then
            echo "Bucket $SITE_BUCKET does not exist. Run Infra with Web checked first." >&2
            exit 1
          fi
          aws s3 sync frontend/dist "s3://$SITE_BUCKET" \
            --delete \
            --exclude "index.html" \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 cp frontend/dist/index.html "s3://$SITE_BUCKET/index.html" \
            --content-type "text/html" \
            --cache-control "no-cache"
          echo "- Frontend: https://www.get1agent.com" >> "$GITHUB_STEP_SUMMARY"

      - name: Print prod outputs
        if: github.event_name == 'workflow_dispatch' && inputs.prod && inputs.apply
        working-directory: infra/terraform/envs/prod
        run: |
          terraform init -input=false -no-color
          API_URL="$(terraform output -raw api_url)"
          echo "## API Gateway" >> "$GITHUB_STEP_SUMMARY"
          echo "- API URL: ${API_URL}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Health: ${API_URL}health" >> "$GITHUB_STEP_SUMMARY"
          echo "- DB health: ${API_URL}health/db" >> "$GITHUB_STEP_SUMMARY"
          echo "- Auth0 audience: $(terraform output -raw auth0_audience)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## VPC/RDS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Jumpbox: $(terraform output -raw jumpbox_instance_id) (stopped after apply)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Local DB: bash infra/aws/db-access.sh" >> "$GITHUB_STEP_SUMMARY"
          echo "- API CNAME: $(terraform output -raw api_gateway_cname_target)" >> "$GITHUB_STEP_SUMMARY"
          JUMPBOX_ID="$(terraform output -raw jumpbox_instance_id)"
          aws ec2 stop-instances --region "$AWS_REGION" --instance-ids "$JUMPBOX_ID" >/dev/null 2>&1 || true

      - name: Upload Terraform plans
        if: github.event_name == 'workflow_dispatch' && inputs.apply == false && (inputs.bootstrap || inputs.web || inputs.prod)
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plans
          if-no-files-found: ignore
          path: |
            infra/terraform/bootstrap/tfplan
            infra/terraform/envs/web/tfplan
            infra/terraform/envs/prod/tfplan
