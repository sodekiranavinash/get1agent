name: Infra

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply bootstrap, web, dev (Lambda + optional data plane EC2/RDS)
        type: boolean
        default: true

concurrency:
  group: infra-dev
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "true"
  TF_STATE_BUCKET: get1agent-terraform-state-us-east-1

jobs:
  terraform:
    name: Terraform (bootstrap + web + dev)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Terraform version
        id: tfver
        run: echo "version=$(tr -d '[:space:]' < infra/terraform/.terraform-version)" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ steps.tfver.outputs.version }}
          terraform_wrapper: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tools/challan-extractor/go.mod
          cache-dependency-path: tools/challan-extractor/go.sum

      - name: Terraform fmt
        run: terraform fmt -check -recursive -diff infra/terraform

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Write dev terraform.tfvars
        run: |
          cat > infra/terraform/envs/dev/terraform.tfvars <<'EOF'
          aws_region   = "us-east-1"
          package_path = "../../../../tools/challan-extractor/dist/function.zip"
          enable_data_plane = true
          EOF

      - name: Package challan-extractor zip
        run: make package
        working-directory: tools/challan-extractor

      - name: Verify Lambda zip
        run: |
          test -s tools/challan-extractor/dist/function.zip
          unzip -l tools/challan-extractor/dist/function.zip | grep bootstrap

      - name: Decide plan vs apply
        id: mode
        run: |
          if [[ "${{ inputs.apply }}" == "true" ]]; then
            echo "mode=apply" >> "$GITHUB_OUTPUT"
          else
            echo "mode=plan" >> "$GITHUB_OUTPUT"
          fi

      - name: Bootstrap (S3 Terraform state)
        run: bash infra/aws/run-terraform.sh bootstrap "${{ steps.mode.outputs.mode }}"

      - name: Web (S3 website)
        run: bash infra/aws/run-terraform.sh web "${{ steps.mode.outputs.mode }}"

      - name: Dev (Lambda + data plane)
        run: bash infra/aws/run-terraform.sh dev "${{ steps.mode.outputs.mode }}"

      - name: Print data plane outputs
        if: inputs.apply == true
        working-directory: infra/terraform/envs/dev
        run: |
          terraform init -input=false -no-color
          if ! terraform output -raw app_public_ip >/dev/null 2>&1; then
            echo "Data plane not deployed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "## Data plane (Kong + RDS)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Kong IP: $(terraform output -raw app_public_ip)" >> "$GITHUB_STEP_SUMMARY"
          echo "- API domain: $(terraform output -raw api_public_hostname)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Kong UI: $(terraform output -raw kong_ui_hostname)" >> "$GITHUB_STEP_SUMMARY"
          echo "- DB tunnel: \`bash infra/aws/db-tunnel.sh\` (SSM, no SSH)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cloudflare: A records \`api\` and \`kong\` -> Kong IP above" >> "$GITHUB_STEP_SUMMARY"
          echo "- Next: run **Deploy Kong** workflow" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Terraform plans
        if: inputs.apply != true
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plans
          if-no-files-found: ignore
          path: |
            infra/terraform/bootstrap/tfplan
            infra/terraform/envs/web/tfplan
            infra/terraform/envs/dev/tfplan
