name: Deploy Kong

on:
  workflow_dispatch:

concurrency:
  group: deploy-kong
  cancel-in-progress: true

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  TF_STATE_BUCKET: get1agent-terraform-state-us-east-1

jobs:
  deploy:
    name: Deploy Kong Gateway on EC2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Terraform version
        id: tfver
        run: echo "version=$(tr -d '[:space:]' < infra/terraform/.terraform-version)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ steps.tfver.outputs.version }}
          terraform_wrapper: false

      - name: Read targets
        id: targets
        working-directory: infra/terraform/envs/dev
        run: |
          terraform init -input=false -no-color
          if ! terraform output -raw app_instance_id >/dev/null 2>&1; then
            echo "Data plane not deployed. Run Infra workflow first." >&2
            exit 1
          fi
          echo "instance=$(terraform output -raw app_instance_id)" >> "$GITHUB_OUTPUT"
          echo "api_hostname=$(terraform output -raw api_public_hostname)" >> "$GITHUB_OUTPUT"
          echo "kong_ui=$(terraform output -raw kong_ui_hostname)" >> "$GITHUB_OUTPUT"
          echo "kong_admin_secret=$(terraform output -raw kong_admin_credentials_secret_arn)" >> "$GITHUB_OUTPUT"

      - name: Deploy Kong via SSM
        run: bash infra/aws/deploy-kong.sh

      - name: Summary
        run: |
          echo "## Kong deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "- API proxy: https://${{ steps.targets.outputs.api_hostname }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Kong Manager: https://${{ steps.targets.outputs.kong_ui }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Admin creds: Secrets Manager \`${{ steps.targets.outputs.kong_admin_secret }}\`" >> "$GITHUB_STEP_SUMMARY"
