name: 🐛 Bug report
description: Report a reproducible bug or unexpected behavior.
title: "[bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report! Please fill in as much detail as you can.
        **Do not report security vulnerabilities here** — see [SECURITY.md](https://github.com/sodekiranavinash/get1agent/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps that reliably reproduce the issue.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the project is affected?
      options:
        - Frontend (React SPA)
        - Backend service (Lambda)
        - Agent runtime (AgentCore / Strands)
        - Ingestion / retrieval
        - Infrastructure / Terraform
        - Local development (Floci)
        - Documentation
        - Other / not sure
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Where did you see this? For example, "local Floci stack on macOS" or "get1agent.com".
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Paste any console output, stack traces, or screenshots.
      render: shell
    validations:
      required: false
